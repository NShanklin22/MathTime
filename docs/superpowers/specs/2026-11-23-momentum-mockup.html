<!doctype html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentum mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The Google Fonts stylesheet (IBM Plex Mono and Sans) is added by src/fonts.js so it can be timed out. -->
<link rel="stylesheet" href="/src/styles.css">
<script type="module" src="/src/main.js"></script>
</head>
<!-- data-kind: the kind of level being played, which shows its play screen
     (main.js): "fact", the equation; "column", the column board. -->
<body class="at-home" data-kind="fact">
  <header class="top">
    <div class="where">
      <!-- "Levels › Addition 1": the way back, and the level by its topic and
           its number within it (view.js, board.js). Where the whole of it,
           with the widest level name, doesn't fit beside the hearts, every
           level's way back is its chevron alone, the separator pointing
           left, "‹ Addition 1" (header.js); it is still the link "Levels".
           The chevron is the separator mirrored and moved 0.25px left, so
           its ink (the stroke, with its round caps and join) runs from 3px
           to 8px of its box: header.js puts the box on a whole device pixel
           at the header's edge, and so the ink starts on one too.
           Above a level, the way back is "Home" (the home screen spec §1):
           "Home › Levels", "Home › Daily challenge", "Home › Progress",
           "Home › Settings" (main.js sets the words). -->
      <nav class="crumbs" aria-label="Breadcrumb">
        <a class="back" href="#" aria-label="Levels" aria-keyshortcuts="Escape" tabindex="-1"><span class="word">Levels</span><svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.25 2.5L3.75 6l3.5 3.5"/></svg></a>
        <svg class="sep" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>
        <span class="here" aria-current="step">Addition 1</span>
        <!-- Practice of the daily challenge: "Home › Daily challenge › Practice" (main.js). -->
        <svg class="sep sub" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>
        <span class="sub">Practice</span>
        <span class="home" aria-current="page">Levels</span>
      </nav>
    </div>
    <div class="lives" role="img" aria-label="3 lives left">
      <svg viewBox="2 3 20 18" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>
      <svg viewBox="2 3 20 18" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>
      <svg viewBox="2 3 20 18" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>
    </div>
  </header>

  <!-- The home screen (2026-11-17-home-screen-design.md §2), run by
       homeview.js: the title and the gear (Settings), the daily challenge
       (Start, or the done line, which opens the board), Next lesson and
       Levels, and the two quiet links. No header: the title is the page's. -->
  <div class="home" role="region" aria-label="Home">
    <div class="stack">
      <div class="mid">
        <div class="markrow">
          <h1 class="mark">Math Time</h1>
          <!-- The gear (Tabler's "settings"), its viewBox cropped to its ink, stroke included. -->
          <button class="gear" type="button" aria-label="Settings"><svg viewBox="2.25 2.25 19.5 19.5" aria-hidden="true"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37c1 .608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <button class="hero" type="button"></button>
        <div class="btns">
          <button class="btn next" type="button"></button>
          <button class="btn levels" type="button"></button>
        </div>
      </div>
      <nav class="links" aria-label="More">
        <a class="to-board" href="#">Leaderboard</a>
        <a class="to-progress" href="#">Progress</a>
      </nav>
    </div>
  </div>

  <!-- Progress (the home screen spec §3a): a row per topic, built by
       homeview.js; a row opens Levels. -->
  <div class="progress" role="region" aria-labelledby="p-title">
    <div class="in">
      <h1 class="s-title" id="p-title">Progress</h1>
      <div class="rows"></div>
    </div>
  </div>

  <!-- Settings (the home screen spec §4): the account only. -->
  <div class="settings" role="region" aria-labelledby="s-title">
    <div class="in">
      <h1 class="s-title" id="s-title">Settings</h1>
      <section class="sect" aria-labelledby="s-acct">
        <h2 class="s-head" id="s-acct">Account</h2>
        <p class="who"></p>
        <div class="buttons"></div>
      </section>
    </div>
  </div>

  <main class="stage">
    <div class="eq" id="eq">
      <span class="qnum" id="qnum">Question 1 of 20</span>
      <span id="a">7</span>
      <span class="op">+</span>
      <span id="b">5</span>
      <span class="op">=</span>
      <span class="slot empty" id="slot">
        <span class="shown" aria-hidden="true"><span id="shown"></span><span class="caret"></span></span>
        <input id="ans" inputmode="none" maxlength="2" autocomplete="off" aria-label="Answer">
      </span>
    </div>
    <!-- A column level's play screen (Levels 6–7), drawn by board.js. On a
         column level the answer field above is moved in after it (main.js). -->
    <div class="board" id="board" aria-hidden="true"></div>
  </main>

  <!-- How far through the run you are (runs spec §2): a segment per
       problem, built by view.js. Screen readers hear "Question N of 20"
       instead. -->
  <div class="run" aria-hidden="true"></div>

  <!-- Outside .stage so announcements survive the switch to the level selector. -->
  <p class="sr-only" role="status" id="status"></p>

  <!-- The level selector: a row per level, built by selector.js. A landmark
       of its own, as the only <main> is the problem area, hidden here. -->
  <div class="select" role="region" aria-label="Levels"></div>

  <!-- The finish screen (runs spec §3), filled in by finish.js, which
       centres each line on its ink. -->
  <div class="finish" role="region" aria-labelledby="done-title">
    <h1 class="line done-title" id="done-title"></h1>
    <p class="line done-time"></p>
    <p class="line done-best"></p>
    <p class="line done-misses"></p>
    <!-- Part 2 puts the key field here (runs spec §6). -->
    <div class="done-buttons">
      <button class="again"><span class="line">Again</span></button>
      <button class="levels"><span class="line">Levels</span></button>
    </div>
  </div>

  <!-- The daily challenge's board (daily spec §4, the home screen spec
       §3b), filled in by dailyview.js: the title, the date and how many
       played, your score above the rows where you aren't on them, the rows
       (which alone scroll, your row pinned at their foot when it is below
       their view), and Practice and Levels. -->
  <div class="dboard" role="region" aria-labelledby="db-title">
    <div class="in">
      <h1 class="s-title" id="db-title">Daily challenge</h1>
      <p class="b-date"></p>
      <p class="b-said" hidden></p>
      <div class="mine"></div>
      <div class="b-list">
        <ol class="rows" aria-label="Today's board"></ol>
        <div class="b-pin" aria-hidden="true" hidden><div class="b-gap"><span>⋯</span></div><div class="r you pinned"></div></div>
      </div>
      <div class="b-btns">
        <button class="practice fill" type="button">Practice</button>
        <p class="b-busy" hidden>Finish it in the other tab</p>
        <button class="levels" type="button">Levels</button>
      </div>
    </div>
  </div>
  <!-- The log-in screen (accounts spec §3), run by login.js: Log in, or
       Sign up with the invite code shown too. No keypad: the system's own
       keyboard types here. -->
  <!-- Leaving a scored daily try partway asks first (main.js): it counts as out. -->
  <div class="leave" role="alertdialog" aria-modal="true" aria-labelledby="leave-head" aria-describedby="leave-text" hidden>
    <h2 class="line l-head" id="leave-head">Leave?</h2>
    <p class="line l-text" id="leave-text"></p>
    <div class="done-buttons">
      <button class="stay"><span class="line">Stay</span></button>
      <button class="go-leave"><span class="line">Leave</span></button>
    </div>
  </div>
  <div class="login" role="region" aria-labelledby="login-title">
    <h1 class="s-title" id="login-title">Log in</h1>
    <form novalidate>
      <div class="fields">
        <div class="field" data-for="signup" hidden>
          <div class="labels"><label for="f-invite">Invite code</label></div>
          <input id="f-invite" name="invite" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-describedby="f-error">
        </div>
        <div class="field">
          <div class="labels"><label for="f-name">Name</label><span class="hint" id="h-name" data-for="signup" hidden>3–20 letters, digits, _&nbsp;-</span></div>
          <input id="f-name" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" enterkeyhint="next" aria-describedby="f-error">
        </div>
        <div class="field">
          <div class="labels"><label for="f-pass">Password</label><span class="hint" id="h-pass" data-for="signup" hidden>8 or more characters</span></div>
          <input id="f-pass" name="password" type="password" autocomplete="current-password" enterkeyhint="go" aria-describedby="f-error">
        </div>
      </div>
      <div class="actions">
        <button class="submit" type="submit"><span class="line">Log in</span></button>
        <p class="error" id="f-error" role="alert"></p>
        <p class="switch"><span class="ask">Have an invite?</span> <button class="swap" type="button">Sign up</button></p>
      </div>
    </form>
  </div>

  <div class="pad" role="group" aria-label="Keypad">
    <button tabindex="-1" data-k="1"><span class="kl">1</span></button>
    <button tabindex="-1" data-k="2"><span class="kl">2</span></button>
    <button tabindex="-1" data-k="3"><span class="kl">3</span></button>
    <button tabindex="-1" data-k="4"><span class="kl">4</span></button>
    <button tabindex="-1" data-k="5"><span class="kl">5</span></button>
    <button tabindex="-1" data-k="6"><span class="kl">6</span></button>
    <button tabindex="-1" data-k="7"><span class="kl">7</span></button>
    <button tabindex="-1" data-k="8"><span class="kl">8</span></button>
    <button tabindex="-1" data-k="9"><span class="kl">9</span></button>
    <button tabindex="-1" data-k="Backspace" aria-label="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(-0.5 0)"><path d="M20 6H9l-5 6l5 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M12.25 10.25l3.5 3.5m0-3.5l-3.5 3.5"/></g></svg></button>
    <button tabindex="-1" data-k="0"><span class="kl">0</span></button>
    <button tabindex="-1" data-k="Enter" class="go" aria-label="Check answer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5l5.5 5.5l11.5-11.5"/></svg></button>
  </div>
<!-- ===================== Momentum mockup (2026-11-23) =====================
     The real game (src/, unchanged), with the momentum design laid over it
     from this page through window.mathtime:
       1. Snappier swaps: a right answer's lock 320ms -> 210ms (trace 150,
          hold 150, out 60, in 90).
       2. The run bar in four groups of five, 8px between groups (2px within).
          The fifth right answer of a group fills its segment and the whole
          group flashes near-white and settles back to green (420ms).
       3. Streak: answers right first time in a row. From 3 in a row, the
          streak's segments glow; more saturated and a bigger glow at 6, and at 10. A miss cools
          them back to plain green (300ms). The swaps get quicker with the
          streak: lock 170ms from 5 in a row, 140ms from 10.
     Only colour and glow change: nothing moves.
     URL params:
       ?seq=RRRRMRR     plays it at once: R right first time, M a miss then right
       ?freeze=pulse    holds a group's flash at its brightest (screenshots)
       ?panel=0         no control strip (screenshots)
     The control strip: Right, Miss then right, Auto (the whole run), Again. -->
<style>
  :root { --hot1: #6ff0ae; --hot2: #5cf7a6; --hot3: #5cffa0; --flash: #ffffff; }
  .run span:nth-child(5n+1):not(:first-child) { margin-left: 6px; }
  .run span.done { transition: background-color .3s, box-shadow .3s; }
  .run span.done.hot1 { background: var(--hot1); box-shadow: 0 0 4px rgba(111, 240, 174, .5); }
  .run span.done.hot2 { background: var(--hot2); box-shadow: 0 0 7px 1px rgba(92, 247, 166, .65); }
  .run span.done.hot3 { background: var(--hot3); box-shadow: 0 0 10px 2px rgba(92, 255, 160, .75); }
  .run span.pulse { animation: mm-pulse 420ms ease-out; }
  @keyframes mm-pulse {
    0%, 25% { background: var(--flash); box-shadow: 0 0 12px 3px rgba(255, 255, 255, .9); }
  }
  html.mm-freeze .run span.pulse { animation-delay: -60ms; animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) { .run span.pulse { animation: none; } .run span.done { transition: none; } }
  .mm-panel { position: fixed; left: 8px; bottom: 8px; z-index: 50; display: flex; gap: 6px; font: 12px var(--font); }
  .mm-panel[hidden] { display: none; }
  .mm-panel button { font: inherit; color: var(--ink); background: rgba(0,0,0,.35); border: 1px solid var(--faint); padding: 4px 8px; cursor: pointer; }
</style>
<div class="mm-panel" hidden>
  <button type="button" data-do="R">Right</button>
  <button type="button" data-do="M">Miss then right</button>
  <button type="button" data-do="auto">Auto</button>
  <button type="button" data-do="again">Again</button>
</div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  while (!window.mathtime) await wait(20);
  const { game, view, levels, play } = window.mathtime;
  const { TIMING } = await import('/src/fx.js');
  if (q.get('freeze') === 'pulse') document.documentElement.classList.add('mm-freeze');

  // Timing tiers by streak (the lock is hold + out).
  function pace(streak) {
    const [trace, hold, out, inn] = streak >= 10 ? [100, 100, 40, 70] : streak >= 5 ? [120, 120, 50, 80] : [150, 150, 60, 90];
    Object.assign(TIMING, { trace, hold, out, in: inn, digitsAt: trace - 50 });
  }
  pace(0);

  let streak = 0, missed = false, from = 0;   // `from`: the segment index the streak began at
  const run = document.querySelector('.run');
  function paint(solved, flashGroup) {
    const segs = [...run.children];
    const tier = streak >= 10 ? 'hot3' : streak >= 6 ? 'hot2' : streak >= 3 ? 'hot1' : null;
    segs.forEach((s, i) => {
      s.classList.remove('hot1', 'hot2', 'hot3');
      if (tier && i >= from && i < solved) s.classList.add(tier);
    });
    if (flashGroup != null) {
      segs.forEach(s => s.classList.remove('pulse'));
      for (const s of segs.slice(flashGroup * 5, flashGroup * 5 + 5)) {
        s.classList.remove('pulse'); void s.offsetWidth; s.classList.add('pulse');
      }
    }
  }
  run.addEventListener('animationend', e => { if (!document.documentElement.classList.contains('mm-freeze')) e.target.classList.remove('pulse'); });

  const showCorrect = view.showCorrect.bind(view), showWrong = view.showWrong.bind(view), showFinished = view.showFinished.bind(view);
  function counted(state) {
    if (missed) { streak = 1; from = state.solved - 1; } else streak += 1;
    missed = false;
    paint(state.solved, state.solved % 5 === 0 ? state.solved / 5 - 1 : null);
  }
  view.showCorrect = (state, next) => { const p = showCorrect(state, next); counted(state); pace(streak); return p; };
  view.showFinished = state => { const p = showFinished(state); counted(state); return p; };
  view.showWrong = state => { missed = true; streak = 0; paint(state.solved, null); pace(0); return showWrong(state); };

  const ans = document.getElementById('ans');
  const key = k => ans.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
  const typeIn = n => { for (const d of String(n)) key(d); key('Enter'); };
  async function settle() { while (game.state.phase === 'correct') await wait(10); await wait(20); }
  async function step(kind) {
    if (game.state.phase !== 'playing') return;
    const { answer } = game.state.problem;
    if (kind === 'M') { typeIn(answer === 0 ? 1 : answer - 1); await wait(30); }
    typeIn(answer);
    await settle();
  }
  function again() { streak = 0; missed = false; from = 0; pace(0); play(levels[0]); }

  again();
  await wait(100);
  for (const c of (q.get('seq') ?? '').toUpperCase()) await step(c);
  if (q.get('panel') !== '0') {
    const panel = document.querySelector('.mm-panel');
    panel.hidden = false;
    panel.addEventListener('click', async e => {
      const d = e.target.closest('button')?.dataset.do;
      if (d === 'again') again();
      else if (d === 'auto') { while (game.state.phase === 'playing') await step(Math.random() < 0.12 ? 'M' : 'R'); }
      else if (d) await step(d);
      ans.focus({ preventScroll: true });
    });
  }
</script>
</body>
</html>
