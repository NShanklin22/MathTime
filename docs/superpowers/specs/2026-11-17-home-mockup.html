<!doctype html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home screen mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The home screen (2026-11-17-home-screen-design.md §1–§4): a tight Home,
     and the pages behind it. Home, Progress, the board and Settings are
     static pages on the game's own styles (src/styles.css); Levels runs the
     game itself (src/main.js), its storage in memory and a fake server, as
     the daily mockup does. Served by the dev server (scripts/serve.mjs),
     from the site root:
       /docs/superpowers/specs/2026-11-17-home-mockup.html
       ?state=before         Home, signed out, before today's try: Levels 1–2 finished (default)
       ?state=after          Home, signed in as "nate", after the try: "✓ Done", "1:12.6 · 5th of 9"
       ?state=offline        Home, signed in, after the try, offline: "✓ Done", "1:12.6", no place
       ?state=all-done       Home, signed in, every level finished: "Last played", Subtraction 3
       ?state=locked         Home, signed out, Levels 1–4 finished: Next lesson is Division 1, locked
       ?state=progress       Progress, signed in, Levels 1–4 finished: a row per topic
       ?state=board          the day's board, signed in, after the try: "Home › Daily challenge", all 9 rows
       ?state=board-12       a longer board: you 10th of 12; the list alone scrolls where it doesn't fit, your row pinned at its foot
       ?state=board-20       you 17th of 20
       &long=1               with after: the longest done line, "10:04.7 · 10th of 12"
       ?state=settings-in    Settings, signed in: "Logged in as nate", Log out
       ?state=settings-out   Settings, signed out: Log in and Sign up
       ?state=levels         Levels, signed in: the topic columns only, "Home › Levels", no "Log in"
     Home, one centred column at every size: the wordmark and the gear,
     the hero (Daily challenge: the title, the date and Start, the one
     filled control) and Next lesson and Levels, a title and a line each,
     centred as one group a little above the middle; the quiet links at the foot.
     Everything is sized in --u, one design pixel: the smaller of the
     window's width and height over the layout's design size, so the
     column fills the window sensibly and never scrolls. Upright, the
     design is 343×812; wide, 460×680; a phone held sideways, 560×390.
     Progress and Settings are set on Home's column, at its scale, their
     breadcrumb on the column's edge. -->
<link rel="stylesheet" href="/src/styles.css">
<style>
  /* ---------- The header ---------- */
  /* Home has no header: the wordmark is the title, the gear at the right
     of its line. Progress and Settings have the breadcrumb, on the
     column's edge. */
  body.at-home .top { display: none; }
  body.at-settings .lives, body.at-progress .lives, body.at-board .lives,
  body.at-board .stage, body.at-board .run, body.at-board .pad,
  body.at-home .stage, body.at-home .run, body.at-home .pad,
  body.at-settings .stage, body.at-settings .run, body.at-settings .pad,
  body.at-progress .stage, body.at-progress .run, body.at-progress .pad { display: none; }
  /* The sub-pages' breadcrumb, one rule: "Home › X" in full, its first
     ink on the column's left edge, a little larger in large windows; the
     way back underlined faintly, 4px under its baseline. */
  body:is(.at-settings, .at-progress, .at-board) { --crumb-line: max(20px, calc(20 * var(--u))); }
  body:is(.at-settings, .at-progress, .at-board) .crumbs { font-size: max(14px, calc(14 * var(--u))); gap: 0.45em; }
  body:is(.at-settings, .at-progress, .at-board) .crumbs .sep { width: max(12px, calc(12 * var(--u))); height: max(12px, calc(12 * var(--u))); }
  body:is(.at-settings, .at-progress, .at-board) .crumbs .back::before { display: none; }
  body:is(.at-settings, .at-progress, .at-board) .crumbs .back .word { text-decoration: underline; text-decoration-color: var(--faint); text-decoration-thickness: 1px; text-underline-offset: 4px; }
  body:is(.at-settings, .at-progress, .at-board) .top {
    padding-left: max(16px, env(safe-area-inset-left), (100vw - var(--cw)) / 2);
    padding-right: max(16px, env(safe-area-inset-right), (100vw - var(--cw)) / 2);
  }

  /* "Home › Levels": the selector's lone "Levels" gets the way back
     before it, and "Log in" leaves the header (spec §4). */
  body.at-select.under-home .crumbs > .back, body.at-select.under-home .crumbs > .sep:not(.sub),
  body.at-select.under-home .crumbs > .here { display: block; }
  body.at-select.under-home .crumbs > .home { display: none; }
  body.at-select.under-home .acct { display: none; }
  body.at-select.under-home .select { --daily-room: 0px; }
  body.at-select.under-home .select .row.daily { display: none; }

  /* ---------- The page ---------- */
  .home, .settings, .progress, .lboard { display: none; }
  body.at-home, body.at-settings, body.at-progress, body.at-board { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: none; }
  body.at-settings .top, body.at-progress .top, body.at-board .top { grid-area: 1 / 1 / 2 / -1; }
  body.at-home .home { grid-area: 1 / 1 / 3 / -1; }
  body.at-settings .settings, body.at-progress .progress, body.at-board .lboard { grid-area: 2 / 1 / 3 / -1; }
  /* One design pixel, --u; the column, --cw; Home's height, --href (the
     column is that tall in every state, so nothing moves between them). */
  body.at-home, body.at-settings, body.at-progress, body.at-board {
    --href: 812; --u: clamp(0.7px, min((100vw - 32px) / 343, 100dvh / var(--href)), 1.3px); --cw: calc(343 * var(--u));
  }
  body.at-home .home, body.at-settings .settings, body.at-progress .progress, body.at-board .lboard {
    display: grid; align-content: safe center; justify-content: center; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 0 max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left));
  }
  body.at-settings .settings, body.at-progress .progress, body.at-board .lboard { align-content: start; }
  .scrollbars-take-room :is(.home, .settings, .progress, .lboard)::-webkit-scrollbar { width: 8px; }
  .scrollbars-take-room :is(.home, .settings, .progress, .lboard)::-webkit-scrollbar-track { background: transparent; }
  .scrollbars-take-room :is(.home, .settings, .progress, .lboard)::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  .scrollbars-take-room :is(.home, .settings, .progress, .lboard)::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 0; }

  /* ---------- Home ---------- */
  /* The wordmark's line, the hero and the two buttons, one group,
     centred a little above the middle; the links at the foot. */
  .home .stack {
    display: grid; grid-template-rows: minmax(0, 1fr) auto; width: var(--cw); height: calc(var(--href) * var(--u));
    padding: calc(max(20px, env(safe-area-inset-top)) + 6 * var(--u)) 0 calc(max(20px, env(safe-area-inset-bottom)) + 12 * var(--u));
  }
  .home .mid { display: grid; align-content: center; row-gap: calc(14 * var(--u)); padding-bottom: calc(40 * var(--u)); }

  /* The wordmark: Plex Mono at its heaviest, set a touch tight, the answer
     box's amber caret after it. The gear in the way back's muted colour,
     its hit area 12px past it all round. */
  .home .markrow { display: flex; align-items: center; justify-content: space-between; gap: calc(16 * var(--u)); margin-bottom: calc(30 * var(--u)); }
  .mark, .s-title {
    margin: 0; font-size: calc(52 * var(--u)); font-weight: 600; line-height: 1; letter-spacing: -0.02em;
    text-box: trim-both cap alphabetic; white-space: nowrap;
  }
  .home .mark .cur { display: inline-block; width: 0.13em; height: 0.7em; margin-left: 0.12em; background: var(--amber); vertical-align: baseline; }
  /* The gear: --gs its ink; padded to a 44px target at least, the padding
     taken back by the margin so its ink stays on the column's edge. */
  .home .gear {
    --gs: calc(30 * var(--u)); --gp: max(8px, (46px - var(--gs)) / 2);
    position: relative; flex: none; box-sizing: content-box; width: var(--gs); height: var(--gs); margin: calc(-1 * var(--gp)); padding: var(--gp);
    border: 0; background: none; color: var(--muted); cursor: pointer; touch-action: manipulation;
  }
  .home .gear svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .home .gear svg path, .home .gear svg circle { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  @media (hover: hover) { .home .gear:hover { color: var(--ink); } }
  .home :is(.gear, .hero, .btn, .links a):focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  /* The hero: the one box with a 2px ink frame. "Daily challenge" and the
     date across the top; under them, Start, filled, the frame's width.
     After the try, in Start's place and at its size, the done line,
     outlined: the check and "Done", then the time and the place, and the
     chevron: the hero opens the board. */
  .home .hero {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: calc(26 * var(--u)); column-gap: calc(16 * var(--u)); align-items: center;
    width: 100%; margin: 0; padding: calc(24 * var(--u)) calc(20 * var(--u)) calc(20 * var(--u));
    border: 0; border-radius: 0; background: transparent; box-shadow: inset 0 0 0 2px var(--ink);
    font: inherit; color: var(--ink); text-align: left; cursor: pointer; touch-action: manipulation;
  }
  .home .hero:active { background: var(--key-press); }
  .home .h-title, .home .h-date { display: block; text-box: trim-both cap alphabetic; white-space: nowrap; }
  .home .h-title { font-size: calc(20 * var(--u)); font-weight: 600; letter-spacing: 0.01em; }
  .home .h-date { font-size: calc(14 * var(--u)); letter-spacing: 0.02em; color: var(--muted); }
  .home .h-cta {
    grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 0.6em; height: calc(60 * var(--u));
    padding: 0 calc(18 * var(--u)); font-size: calc(19 * var(--u)); font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
    background: var(--ink); color: var(--bg);
  }
  .home .hero:active .h-cta { background: var(--go-press); }
  /* Done, in Start's place and at its size, outlined: the button that
     opens the board. "✓ Done" at the left; the time, the place and the
     chevron (the tiles', at their size and weight) pinned to the right.
     One line at every width: room for "10:04.7 · 10th of 12" at 320px. */
  .home .h-cta.done { justify-content: space-between; gap: calc(12 * var(--u)); padding: 0 calc(14 * var(--u)); background: transparent; color: var(--ink); box-shadow: var(--key-ring); font-size: calc(15 * var(--u)); }
  .home .hero:active .h-cta.done { background: transparent; }
  .home .h-cta .ok { display: flex; align-items: center; gap: 0.45em; color: var(--good); }
  .home .h-cta .ok, .home .h-cta .res { flex: none; }
  .home .h-cta .res { display: flex; align-items: center; gap: calc(10 * var(--u)); font-variant-numeric: tabular-nums; }
  .home .h-cta .chev, .home .btn .chev { flex: none; height: calc(18 * var(--u)); color: var(--ink); }
  .home .tick { display: block; height: 0.8em; width: auto; aspect-ratio: 20 / 14.5; overflow: visible; }
  .home .tick path { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .home .chev { display: block; height: 0.8em; width: auto; aspect-ratio: 9.5 / 16.5; overflow: visible; }
  .home .chev path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* Next lesson and Levels: the selector's tiles, plain. What it opens
     leads, in ink at the title's weight ("Division 1", "Levels"), the
     muted line under it ("Next lesson", "4 of 7 finished"); at the right,
     centred, the chevron, on Start's right edge, or the lock in its place. */
  .home .btns { display: grid; grid-template-columns: minmax(0, 1fr); gap: calc(12 * var(--u)); }
  .home .btn {
    display: flex; align-items: center; justify-content: space-between; gap: calc(16 * var(--u));
    width: 100%; height: calc(76 * var(--u)); margin: 0; padding: 0 calc(20 * var(--u));
    border: 0; border-radius: 0; background: transparent; box-shadow: var(--key-ring);
    font: inherit; color: var(--ink); text-align: left; cursor: pointer; touch-action: manipulation; min-width: 0;
  }
  .home .btn:active { background: var(--key-press); }
  .home .b-txt { display: flex; flex-direction: column; gap: calc(11 * var(--u)); min-width: 0; }
  .home .b-title, .home .b-line { display: block; text-box: trim-both cap alphabetic; white-space: nowrap; }
  .home .b-title { font-size: calc(18 * var(--u)); font-weight: 600; letter-spacing: 0.01em; }
  .home .b-line { font-size: calc(14 * var(--u)); letter-spacing: 0.02em; color: var(--muted); }
  .home .lock { display: block; flex: none; height: calc(22 * var(--u)); width: auto; aspect-ratio: 16.7 / 20.7; overflow: visible; color: var(--ink); }
  .home .lock path, .home .lock rect { fill: none; stroke: currentColor; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }

  /* The quiet links: the way back's link, muted, its faint underline. */
  .home .links { display: flex; justify-content: center; gap: calc(40 * var(--u)); }
  .home .links a {
    position: relative; font-size: calc(16 * var(--u)); letter-spacing: 0.02em; color: var(--muted); text-decoration: underline;
    text-decoration-color: var(--faint); text-decoration-thickness: 1px; text-underline-offset: 0.3em; white-space: nowrap;
  }
  .home .links a::after { content: ""; position: absolute; inset: -14px -10px; }
  @media (hover: hover) { .home .links a:hover { color: var(--ink); text-decoration-color: currentColor; } }

  /* ---------- Progress ---------- */
  /* A large title on Home's column; a row per topic, each a button that
     opens Levels: the name, a bar of one segment per built level (the run
     bar's segments, 2px apart: green finished, faint not), "1 of 2" and a
     chevron; faint rules between. */
  .progress .in, .settings .in, .lboard .in { width: var(--cw); padding: calc(28 * var(--u)) 0 calc(24 * var(--u)); }
  .s-title { margin-bottom: calc(36 * var(--u)); font-size: calc(38 * var(--u)); }
  .progress .rows { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content max-content; border-top: 1px solid var(--faint); }
  .progress .row {
    display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: center; column-gap: calc(16 * var(--u));
    height: calc(60 * var(--u)); margin: 0; padding: 0; border: 0; border-bottom: 1px solid var(--faint); border-radius: 0;
    background: transparent; font: inherit; color: var(--ink); text-align: left; cursor: pointer; touch-action: manipulation;
  }
  .progress .row:active { background: var(--key-press); }
  .progress .row:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .progress .topic, .progress .of { display: block; text-box: trim-both cap alphabetic; white-space: nowrap; }
  .progress .topic { font-size: calc(17 * var(--u)); letter-spacing: 0.02em; }
  .progress .of { justify-self: end; font-size: calc(15 * var(--u)); letter-spacing: 0.02em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress .bar { display: flex; gap: 2px; }
  .progress .bar span { flex: 1; height: calc(8 * var(--u)); background: var(--faint); }
  .progress .bar span.done { background: var(--good); }
  .progress .chev { display: block; height: calc(13 * var(--u)); width: auto; aspect-ratio: 9.5 / 16.5; overflow: visible; color: var(--muted); }
  .progress .chev path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- The board (spec §3b) ---------- */
  /* The day's board on Home's column: the large title, the date and how
     many played, the rows as the full board sets them (place, name, score;
     an out's score muted; your row the one outline, at the title's weight),
     and Practice, filled, and Levels. Every row shows where they fit; a
     long board's list alone scrolls, in its own area, a whole number of
     rows tall (boardview below), with the theme's scrollbar, opening at
     1st place, the title and buttons where they are; your row, when it is
     below the view, pinned at the list's foot. Sideways, the title, the
     date and the buttons on the left, the list on the right from the top. */
  body.at-board .lboard { overflow: hidden; align-content: stretch; }
  .lboard .in {
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, max-content) auto;
    grid-template-areas: "title" "date" "rows" "btns"; align-content: start; min-height: 0; height: 100%;
  }
  .lboard .s-title { grid-area: title; margin-bottom: calc(24 * var(--u)); }
  .lboard .b-date { grid-area: date; }
  /* The list's area: the rows, which alone scroll, and under them, when
     your row is below their view, the break (a row of its own, "⋯",
     muted, centred) and your row, pinned, the area's full width. */
  .lboard .b-list { grid-area: rows; display: flex; flex-direction: column; min-height: 0; margin-top: calc(24 * var(--u)); }
  .lboard .b-rows { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .lboard .b-pin { flex: none; }
  .lboard .b-pin[hidden] { display: none; }
  .lboard .b-pin.away { visibility: hidden; }
  .lboard .b-gap { display: flex; align-items: center; justify-content: center; height: calc(28 * var(--u)); font-size: calc(24 * var(--u)); line-height: 1; color: var(--muted); }
  .lboard .b-gap span { display: block; letter-spacing: 0.1em; }
  .lboard .b-btns { grid-area: btns; }
  .scrollbars-take-room .lboard .b-rows::-webkit-scrollbar { width: 8px; }
  .scrollbars-take-room .lboard .b-rows::-webkit-scrollbar-track { background: transparent; }
  .scrollbars-take-room .lboard .b-rows::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  .scrollbars-take-room .lboard .b-rows::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 0; }
  .scrollbars-take-room .lboard .b-rows.scrolls { padding-right: 4px; }
  /* Scrolling: a faint rule at the list's top and foot, as the game's. */
  .lboard .b-rows.scrolls { border-top: 1px solid var(--faint); border-bottom: 1px solid var(--faint); }
  .lboard .b-list.pinned .b-rows.scrolls { border-bottom: 0; }
  .lboard .b-date { margin: 0; font-size: calc(15 * var(--u)); letter-spacing: 0.02em; color: var(--muted); text-box: trim-both cap alphabetic; white-space: nowrap; }
  .lboard .b-rows { list-style: none; margin: 0; padding: 0; }
  .lboard .b-rows.scrolls { margin-top: -1px; }
  .lboard .r {
    display: grid; grid-template-columns: 2ch minmax(0, 1fr) auto; column-gap: calc(16 * var(--u)); align-items: center;
    height: calc(40 * var(--u)); padding: 0 calc(14 * var(--u)) 0 calc(8 * var(--u)); font-size: calc(16 * var(--u)); letter-spacing: 0.02em; white-space: nowrap;
  }
  .lboard .r .place { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lboard .r .who { overflow: hidden; text-overflow: ellipsis; }
  .lboard .r .score { text-align: right; font-variant-numeric: tabular-nums; }
  .lboard .r.out .score { color: var(--muted); }
  .lboard .r.you { box-shadow: var(--key-ring); font-weight: 600; }
  .lboard .r.you .place { font-weight: 400; }
  .lboard .b-btns { display: grid; grid-template-columns: 1fr 1fr; gap: calc(12 * var(--u)); margin-top: calc(24 * var(--u)); }

  /* ---------- Settings ---------- */
  /* The account under a faint rule, its buttons at Start's size: Log out
     alone; or Log in, filled (the one most come for), and Sign up. */
  .settings .sect { padding-top: calc(22 * var(--u)); border-top: 1px solid var(--faint); }
  .settings .s-head { margin: 0; font-size: calc(15 * var(--u)); font-weight: 600; letter-spacing: 0.01em; color: var(--muted); text-box: trim-both cap alphabetic; }
  .settings .who { margin: calc(24 * var(--u)) 0 0; font-size: calc(20 * var(--u)); letter-spacing: 0.01em; text-box: trim-both cap alphabetic; white-space: nowrap; }
  .settings .who b { font-weight: 600; }
  .settings .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: calc(12 * var(--u)); margin-top: calc(32 * var(--u)); }
  :is(.settings, .lboard) button {
    display: flex; align-items: center; justify-content: center; height: calc(60 * var(--u)); padding: 0; border: 0; border-radius: 0;
    background: transparent; box-shadow: var(--key-ring); color: var(--ink); font: 600 calc(18 * var(--u))/1 var(--font); letter-spacing: 0.02em;
    cursor: pointer; touch-action: manipulation;
  }
  :is(.settings, .lboard) button.fill { background: var(--ink); color: var(--bg); box-shadow: none; }
  :is(.settings, .lboard) button:active { background: var(--key-press); }
  :is(.settings, .lboard) button.fill:active { background: var(--go-press); }
  :is(.settings, .lboard) button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  /* ---------- Wide windows ---------- */
  /* The same column, wider and larger: designed at 460×680. */
  @media (min-width: 900px) {
    body.at-home, body.at-settings, body.at-progress, body.at-board {
      --href: 680; --u: clamp(0.7px, min((100vw - 48px) / 460, 100dvh / var(--href)), 1.6px); --cw: calc(460 * var(--u));
    }
    .home .stack { padding: calc(36 * var(--u)) 0 calc(32 * var(--u)); }
    .home .mid { row-gap: calc(16 * var(--u)); padding-bottom: calc(32 * var(--u)); }
    .home .markrow { margin-bottom: calc(34 * var(--u)); }
    .mark { font-size: calc(68 * var(--u)); }
    .home .gear { --gs: calc(36 * var(--u)); }
    .home .hero { row-gap: calc(32 * var(--u)); padding: calc(30 * var(--u)) calc(28 * var(--u)) calc(28 * var(--u)); }
    .home .h-cta.done { padding: 0 calc(20 * var(--u)); font-size: calc(19 * var(--u)); }
    .home .h-cta .chev, .home .btn .chev { height: calc(20 * var(--u)); }
    .home .h-title { font-size: calc(26 * var(--u)); }
    .home .h-date { font-size: calc(17 * var(--u)); }
    .home .h-cta { height: calc(72 * var(--u)); font-size: calc(22 * var(--u)); padding: 0 calc(24 * var(--u)); }
    .home .btns { gap: calc(16 * var(--u)); }
    .home .btn { height: calc(84 * var(--u)); padding: 0 calc(28 * var(--u)); }
    .home .b-txt { gap: calc(13 * var(--u)); }
    .home .b-title { font-size: calc(21 * var(--u)); }
    .home .b-line { font-size: calc(16 * var(--u)); }
    .home .lock { height: calc(26 * var(--u)); }

  /* ---------- A phone held sideways ---------- */
  /* The same column, wider and shorter: Next lesson and Levels side by
     side. Designed at 560×390. */

      grid-template-areas: "title rows" "date rows" "btns rows" ". rows"; column-gap: calc(24 * var(--u));

<script type="module">
  const params = new URLSearchParams(location.search);
  const state = params.get('state') ?? 'before';
  const ME = 'nate';
  const $ = sel => document.querySelector(sel);
  const body = document.body;
  const { LEVELS, levelName } = await import('/src/levels.js');
  const { formatTime } = await import('/src/finish.js');
  const { fontsReady } = await import('/src/fonts.js');

  // ---------- Each state's player ----------
  // Which levels (by build order, n) are finished, with their best times;
  // signed in or out; today's try; the board.
  const BESTS = { 1: 72_400, 2: 81_900, 3: 95_300, 4: 88_100, 5: 101_700, 6: 124_800, 7: 108_300 };
  const finishedOf = { before: [1, 2], after: [1, 2, 3, 4], offline: [1, 2, 3, 4], 'all-done': [1, 2, 3, 4, 5, 6, 7], locked: [1, 2, 3, 4] };
  const signedOut = ['before', 'locked', 'settings-out'].includes(state);
  const finished = new Set(finishedOf[state] ?? [1, 2, 3, 4]);
  const LAST_PLAYED = 7;                       // all-done: Subtraction 3
  const tried = ['after', 'offline'].includes(state);
  const DAY = new Date(2026, 10, 17).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).replace(',', '');
  const NINE = [
    { name: 'alex', totalMs: 58_700 }, { name: 'bea', totalMs: 61_900 }, { name: 'jonah', totalMs: 64_200 },
    { name: 'priya', totalMs: 69_000 }, { name: ME, totalMs: 72_600 }, { name: 'theo', totalMs: 79_600 },
    { name: 'kit', totalMs: 84_100 }, { name: 'rowan', totalMs: null, reached: 12 }, { name: 'ivy', totalMs: null, reached: 5 },
  ];
  const TICK = '<svg class="tick" viewBox="2 5 20 14.5" aria-hidden="true"><path d="M3.5 12.5l5.5 5.5l11.5-11.5"/></svg>';
  const LOCK = '<svg class="lock" viewBox="-0.35 -0.35 16.7 20.7" aria-hidden="true"><path d="M4 9V5a4 4 0 0 1 8 0v4"/><rect x="1" y="9" width="14" height="10" rx="1"/><path d="M8 13v2"/></svg>';
  const CHEV = '<svg class="chev" viewBox="7.75 3.75 9.5 16.5" aria-hidden="true"><path d="M9 5l7 7l-7 7"/></svg>';
  const CHEV_R = '<svg class="chev" viewBox="7.75 3.75 9.5 16.5" aria-hidden="true"><path d="M9 5l7 7l-7 7"/></svg>';
  const txt = (title, line) => `<span class="b-txt"><span class="b-title">${title}</span><span class="b-line">${line}</span></span>`;
  const topics = [...new Set(LEVELS.map(l => l.topic))];

  // ---------- Home ----------
  function showHome() {
    body.className = 'at-home';
    // Daily challenge: the title and the date; Start before the try. After
    // it, in Start's place, the check and "Done", the time and the place
    // (offline, the time alone): the hero opens the board.
    const hero = $('.hero');
    const top = `<span class="h-title">Daily challenge</span><span class="h-date">${DAY}</span>`;
    if (!tried) {
      hero.innerHTML = top + '<span class="h-cta">Start</span>';
      hero.setAttribute('aria-label', `Daily challenge, ${DAY}: 20 problems, one try. Start`);
    } else {
      const long = params.has('long');
      const time = long ? '10:04.7' : '1:12.6';
      const res = state === 'offline' ? time : long ? `${time} · 10th of 12` : `${time} · 5th of 9`;
      hero.innerHTML = top + `<span class="h-cta done"><span class="ok">${TICK}Done</span><span class="res">${res}${CHEV}</span></span>`;
      hero.setAttribute('aria-label', `Daily challenge, ${DAY}: done, ${res.replace(' · ', ', ')}. Show the board`);
      hero.addEventListener('click', () => { location.search = '?state=board'; });
    }
    // Next lesson: the first unfinished level in level order; locked, the
    // lock. With all finished, "Last played". Levels: how many are finished.
    const next = $('.btn.next');
    const left = LEVELS.find(l => !finished.has(l.n));
    const level = left ?? LEVELS.find(l => l.n === LAST_PLAYED);
    const locked = signedOut && level.n >= 5;
    const title = left ? 'Next lesson' : 'Last played';
    next.innerHTML = txt(levelName(level), title) + (locked ? LOCK : CHEV_R);
    next.setAttribute('aria-label', `${title}: ${levelName(level)}${locked ? ', locked: log in to play' : ''}`);
    const levels = $('.btn.levels');
    levels.innerHTML = txt('Levels', `${finished.size} of ${LEVELS.length} finished`) + CHEV_R;
    levels.addEventListener('click', () => { location.search = '?state=levels'; });
    $('.gear').addEventListener('click', () => { location.search = signedOut ? '?state=settings-out' : '?state=settings-in'; });
  }

  // ---------- Progress ----------
  function showProgress() {
    body.className = 'at-progress';
    $('.crumbs .here').textContent = 'Progress';
    $('.progress .rows').innerHTML = topics.map(t => {
      const of = LEVELS.filter(l => l.topic === t), done = of.filter(l => finished.has(l.n)).length;
      return `<button class="row" type="button" aria-label="${t}: ${done} of ${of.length} finished. Show Levels"><span class="topic">${t}</span>`
        + `<span class="bar" aria-hidden="true">${of.map((l, i) => `<span${i < done ? ' class="done"' : ''}></span>`).join('')}</span>`
        + `<span class="of" aria-hidden="true">${done} of ${of.length}</span>${CHEV}</button>`;
    }).join('');
    for (const r of document.querySelectorAll('.progress .row')) r.addEventListener('click', () => { location.search = '?state=levels'; });
    $('.crumbs .back').addEventListener('click', e => { e.preventDefault(); location.search = '?state=after'; });
  }

  // ---------- Settings ----------
  function showSettings() {
    body.className = 'at-settings';
    const who = $('.settings .who'), buttons = $('.settings .buttons');
    if (state === 'settings-in') {
      who.innerHTML = `Logged in as <b>${ME}</b>`;
      buttons.innerHTML = '<button type="button">Log out</button>';
    } else {
      who.textContent = 'Not logged in';
      buttons.innerHTML = '<button type="button" class="fill">Log in</button><button type="button">Sign up</button>';
    }
    $('.crumbs .back').addEventListener('click', e => { e.preventDefault(); location.search = signedOut ? '?state=before' : '?state=after'; });
  }

  // ---------- Levels: the game itself ----------
  // Its storage in memory, signed in, Levels 1–4 finished; a fake server.
  async function startGame() {
    const mem = new Map();
    const shim = {
      getItem: k => (mem.has(k) ? mem.get(k) : null), setItem: (k, v) => { mem.set(k, String(v)); },
      removeItem: k => { mem.delete(k); }, clear: () => mem.clear(),
      key: i => [...mem.keys()][i] ?? null, get length() { return mem.size; },
    };
    Object.defineProperty(window, 'localStorage', { value: shim, configurable: true });
    const done = [...finished];
    shim.setItem('mathtime.runs', JSON.stringify(done.map(n => ({ id: `r${n}`, level: n, totalMs: BESTS[n], misses: 0, problems: [] }))));
    shim.setItem('mathtime.outbox', '[]');
    shim.setItem('mathtime.account', JSON.stringify({ name: ME }));
    shim.setItem('mathtime.best', JSON.stringify({ name: ME, best: Object.fromEntries(done.map(n => [n, BESTS[n]])) }));
    const json = (status, b) => new Response(JSON.stringify(b), { status, headers: { 'Content-Type': 'application/json' } });
    window.fetch = async (url) => {
      const path = new URL(url, location.href).pathname;
      if (path === '/api/me') return json(200, { name: ME });
      if (path === '/api/best') return json(200, Object.fromEntries(done.map(n => [n, BESTS[n]])));
      return json(404, {});
    };
  }

  // Levels: the game's own selector, without the tile, under "Home".
  async function showLevels() {
    await startGame();
    body.className = 'at-select under-home';
    $('.crumbs .here').textContent = 'Levels';
    await import('/src/main.js');
    // The game keeps its own body classes; keep this one with them.
    new MutationObserver(() => { if (!body.classList.contains('under-home')) body.classList.add('under-home'); })
      .observe(body, { attributes: true, attributeFilter: ['class'] });
    $('.crumbs .back').addEventListener('click', e => { e.preventDefault(); location.search = '?state=after'; }, true);
  }

  // The board: the day's, on Home's column: the large title, the date and
  // how many played, every row, your row marked; Practice and Levels.
  // board-12 and board-20: longer boards, you 10th and 17th.
  const LONG = ['ollie', 'nadia', 'finn', 'zara', 'sol', 'marcus', 'lena', 'oscar', 'ruth', 'dev', 'hugo', 'mei', 'june', 'ezra', 'cleo', 'ravi', 'noor', 'pip', 'ana_b'];
  const boardOf = n => {
    if (n === 9) return NINE;
    const at = n === 12 ? 9 : 16, list = [];
    for (let i = 0, j = 0; i < n; i++) {
      if (i === at) list.push({ name: ME, totalMs: 52_300 + i * 3_100 });
      else if (i >= n - 2) list.push({ name: LONG[j++], totalMs: null, reached: 14 - (n - i) * 4 });
      else list.push({ name: LONG[j++], totalMs: 52_300 + i * 3_100 + (i * 977) % 1_400 });
    }
    return list;
  };
  function showBoard() {
    const players = boardOf(state === 'board-12' ? 12 : state === 'board-20' ? 20 : 9);
    body.className = 'at-board';
    $('.crumbs .here').textContent = 'Daily challenge';
    $('.lboard .b-date').textContent = `${DAY} · ${players.length} played`;
    $('.lboard .b-rows').innerHTML = players.map((p, i) => `<li class="r${p.totalMs == null ? ' out' : ''}${p.name === ME ? ' you' : ''}"${p.name === ME ? ' aria-current="true"' : ''}>`
      + `<span class="place">${i + 1}</span><span class="who">${p.name}</span><span class="score">${p.totalMs == null ? `Out at ${p.reached}` : formatTime(p.totalMs)}</span></li>`).join('');
    $('.crumbs .back').addEventListener('click', e => { e.preventDefault(); location.search = '?state=after'; });
    // boardview: a list too long for its room is a whole number of rows
    // tall, opening at the top; your row, below its view, pinned under it
    // after the break (hidden, its room kept, while it is in view) only
    // where rows are hidden between: where your row comes right after the
    // last one shown, it joins the list in place and the list ends with it.
    const rows = $('.lboard .b-rows'), list = $('.lboard .b-list'), pin = $('.lboard .b-pin');
    const you = rows.querySelector('.you');
    if (you) pin.querySelector('.r').innerHTML = you.innerHTML;
    const inView = () => {
      const a = rows.getBoundingClientRect(), b = you.getBoundingClientRect();
      return b.top >= a.top - 0.5 && b.bottom <= a.bottom + 0.5;
    };
    const fit = () => {
      rows.classList.remove('scrolls');
      list.classList.remove('pinned');
      rows.style.height = '';
      pin.hidden = true;
      pin.classList.remove('away');
      if (rows.scrollHeight <= rows.clientHeight + 1) return;
      rows.classList.add('scrolls');
      rows.scrollTop = 0;
      const row = rows.querySelector('li').getBoundingClientRect().height;
      const size = () => { rows.style.height = ''; rows.style.height = Math.max(1, Math.floor(rows.clientHeight / row)) * row + rows.offsetHeight - rows.clientHeight + 'px'; };
      if (you) { pin.hidden = false; list.classList.add('pinned'); }
      size();
      if (you && inView()) { pin.hidden = true; list.classList.remove('pinned'); size(); return; }
      if (you) {
        const shown = Math.round((rows.clientHeight) / row), at = [...rows.children].indexOf(you);
        if (at === shown) {
          pin.hidden = true;
          list.classList.remove('pinned');
          rows.style.height = '';
          rows.style.height = (at + 1) * row + rows.offsetHeight - rows.clientHeight + 'px';
        }
      }
    };
    rows.addEventListener('scroll', () => { if (you && !pin.hidden) pin.classList.toggle('away', inView()); });
    requestAnimationFrame(fit);
    addEventListener('resize', () => requestAnimationFrame(fit));
  }

  // ---------- The state asked for ----------
  if (state === 'levels') {
    await showLevels();
    await fontsReady();
    await new Promise(r => setTimeout(r, 300));
  } else {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;top:0;left:0;width:100px;height:100px;overflow:scroll;visibility:hidden';
    body.append(probe);
    document.documentElement.classList.toggle('scrollbars-take-room', probe.offsetWidth - probe.clientWidth > 0);
    probe.remove();
    if (state.startsWith('settings')) showSettings();
    else if (state === 'progress') showProgress();
    else if (state.startsWith('board')) showBoard();
    else showHome();
    await fontsReady();
    document.documentElement.classList.remove('loading');
  }
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
