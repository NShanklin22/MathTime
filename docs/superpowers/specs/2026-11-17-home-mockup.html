<!-- The home screen (2026-11-17-home-screen-design.md): Home, Settings, and
     Levels without the daily tile. Home and Settings are static pages on the
     game's own styles (src/styles.css); Levels runs the game itself
     (src/main.js), its storage in memory and a fake server, as the daily
     mockup does. Served by the dev server (scripts/serve.mjs), from the
     site root:
       /docs/superpowers/specs/2026-11-17-home-mockup.html
       ?state=before         Home, signed out, before today's try: Levels 1–2 finished (default)
       ?state=after          Home, signed in as "nate", after the try: the check, 1:12.6 large, "5th of 9 today"; your row under the top 3
       ?state=empty          Home, signed in, before the try, nobody has played: "No scores yet today"
       ?state=offline        Home, signed in, after the try, offline: the check, the time, the date alone; the board's note
       ?state=all-done       Home, signed in, every level finished: "Last played", Subtraction 3, its check and best
       ?state=locked         Home, signed out, Levels 1–4 finished: Next lesson is Division 1, locked, "Log in to play"
       ?state=settings-in    Settings, signed in: "Logged in as nate", Log out
       ?state=settings-out   Settings, signed out: Log in and Sign up
       ?state=levels         Levels, signed in: the topic columns only, "Home › Levels", no "Log in"

     Home is a title screen, in three steps of weight (the redesign brief
     of 2026-11-17, in place of spec §3):
       1. The wordmark, "MathTime" and the answer box's amber caret, large.
       2. Daily challenge, the hero: a 2px ink frame, the title and date,
          a sample problem in the play screen's digits and the filled Start
          (the check key's and "Again"'s fill). After the try: the green
          check and "Done", your time as large as the finish screen's, your
          place, and "Today's board" outlined.
       3. Next lesson and Levels, the selector's tiles, half the hero's
          weight. Then, under one faint rule, Today's board and Progress,
          set as one section: the same heading, the same row height.
     Everything is sized in --u, one design pixel, so the composition fills
     the window and never scrolls: the smaller of the width and the height
     over the layout's own design size. Upright (under 900px wide), one
     column, designed at 343×770 (375×812 less gutters and the header);
     wide, two columns, 1000×612 (a 1366×657 laptop); a phone held
     sideways, three columns, 812×342 (844×390). Below 0.7px a design
     pixel (under about 320×600) Home scrolls inside the page, with the
     theme's scrollbar. -->
<link rel="stylesheet" href="/src/styles.css">
<style>
  /* ---------- The header ---------- */
  /* Home has no header: the wordmark is the title, and the gear sits at
     the right of its line, the content's edge. */
  body.at-home .top { display: none; }
  body.at-settings .lives,
  body.at-home .stage, body.at-home .run, body.at-home .pad,
  body.at-settings .stage, body.at-settings .run, body.at-settings .pad { display: none; }

  /* "Home › Settings", "Home › Levels": the way back is "Home". On Levels
     the selector's lone "Levels" gets the way back before it, and "Log in"
     leaves the header (spec §4). */
  body.at-select.under-home .crumbs > .back, body.at-select.under-home .crumbs > .sep:not(.sub),
  body.at-select.under-home .crumbs > .here { display: block; }
  body.at-select.under-home .crumbs > .home { display: none; }
  body.at-select.under-home .acct { display: none; }
  body.at-select.under-home .select { --daily-room: 0px; }
  body.at-select.under-home .select .row.daily { display: none; }

  /* ---------- The page ---------- */
  .home, .settings { display: none; }
  body.at-home, body.at-settings { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: none; }
  body.at-settings .top { grid-area: 1 / 1 / 2 / -1; }
  body.at-home .home { grid-area: 1 / 1 / 3 / -1; }
  body.at-settings .settings { grid-area: 2 / 1 / 3 / -1; }
  /* One design pixel, --u: upright, 343×812 is the design, the whole
     window less its gutters. --cw is the column, Home's and Settings'
     alike; --href the column's height, which the composition is laid in
     from the top and which is centred in the window, so nothing moves
     between states. */
  body.at-home, body.at-settings {
    --href: 812; --u: clamp(0.7px, min((100vw - 32px) / 343, 100dvh / var(--href)), 1.3px); --cw: calc(343 * var(--u));
  }
  body.at-home .home, body.at-settings .settings {
    display: grid; align-content: safe center; justify-content: center; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 0 max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left));
  }
  .home .stack {
    --hero-h: calc(224 * var(--u)); --row-h: calc(33 * var(--u)); --prog-h: calc(29 * var(--u)); --gap: calc(12 * var(--u));
    display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; width: var(--cw); height: calc(var(--href) * var(--u));
    padding: calc(max(20px, env(safe-area-inset-top)) + 4 * var(--u)) 0 calc(20 * var(--u));
  }

  /* ---------- 1. The wordmark ---------- */
  /* Plex Mono at its heaviest, set a touch tight, with the answer box's
     caret after it: amber, as tall as the capitals, on the baseline. */
  .home .markrow { display: flex; align-items: center; justify-content: space-between; gap: calc(16 * var(--u)); margin: 0 0 calc(22 * var(--u)); }
  .home .mark {
    margin: 0; font-size: calc(44 * var(--u)); font-weight: 600; line-height: 1; letter-spacing: -0.02em;
    text-box: trim-both cap alphabetic; white-space: nowrap;
  }
  /* The gear (Tabler's "settings"), in the way back's muted colour, about
     as tall as the wordmark's capitals; its hit area 12px past it all round. */
  .home .gear {
    position: relative; flex: none; width: calc(30 * var(--u)); height: calc(30 * var(--u)); margin: 0; padding: 0;
    border: 0; background: none; color: var(--muted); cursor: pointer; touch-action: manipulation;
  }
  .home .gear svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .home .gear svg path, .home .gear svg circle { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .home .gear::after { content: ""; position: absolute; inset: -12px; }
  @media (hover: hover) { .home .gear:hover { color: var(--ink); } }
  .home .gear:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .home .mark .cur { display: inline-block; width: 0.13em; height: 0.7em; margin-left: 0.12em; background: var(--amber); vertical-align: baseline; }

  /* ---------- 2. Daily challenge, the hero ---------- */
  /* One button (offline after the try, no button: there is nowhere to
     go). The title and the date across the top in every state; upright,
     the sample problem or your time large in the middle, the control the
     button's width at the foot. */
  .home .hero {
    position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto auto;
    grid-template-areas: "title date" "big big" "place place" "cta cta"; align-content: space-between; align-items: center; column-gap: calc(16 * var(--u));
    width: 100%; height: var(--hero-h); margin: 0; padding: calc(22 * var(--u)) calc(20 * var(--u)) calc(20 * var(--u));
    border: 0; border-radius: 0; background: transparent; box-shadow: inset 0 0 0 2px var(--ink);
    font: inherit; color: var(--ink); text-align: left; cursor: pointer; touch-action: manipulation;
  }
  div.hero { cursor: default; }
  button.hero:active { background: var(--key-press); }
  .home .hero:focus-visible, .home .tile:focus-visible, .home .bd:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .home .h-title, .home .h-date, .home .h-sub { display: block; text-box: trim-both cap alphabetic; white-space: nowrap; }
  .home .h-title { grid-area: title; font-size: calc(20 * var(--u)); font-weight: 600; letter-spacing: 0.01em; }
  .home .h-date { grid-area: date; justify-self: end; font-size: calc(15 * var(--u)); letter-spacing: 0.02em; color: var(--muted); }
  .home .h-sub { display: none; }
  .home .tick path { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  /* The sample, in the play screen's digits: weight 500, the signs muted. */
  .home .h-big { grid-area: big; justify-self: center; }
  .home .hero:not(.done) .h-big { grid-area: 2 / 1 / 4 / -1; }
  .home .eqs { display: flex; gap: 0.32em; font-size: calc(76 * var(--u)); font-weight: 500; line-height: 1; text-box: trim-both cap alphabetic; white-space: nowrap; }
  .home .eqs > span { display: block; text-box: trim-both cap alphabetic; }
  .home .eqs .op { color: var(--muted); }
  /* After the try: the time as the finish screen sets it, larger, and
     under it the finished level's green check and "Done", then the place,
     at the finish screen's best line's weight. The gaps above the time,
     between, and down to the control are the same. */
  .home .res { display: contents; }
  .home .res .time { grid-area: big; justify-self: center; display: block; font-size: calc(62 * var(--u)); font-weight: 500; line-height: 1; text-box: trim-both cap alphabetic; font-variant-numeric: tabular-nums; }
  .home .res .place { grid-area: place; justify-self: center; display: flex; align-items: center; gap: 0.5em; height: 1cap; font-size: calc(15 * var(--u)); font-weight: 600; letter-spacing: 0.02em; color: var(--muted); white-space: nowrap; }
  .home .res .ok { display: flex; align-items: center; gap: 0.45em; color: var(--good); }
  .home .res .ok .tick { display: block; height: 0.85em; width: auto; aspect-ratio: 20 / 14.5; overflow: visible; }
  /* The control: the finish screen's button. Filled before the try (the
     one thing to do); after, "Full board", outlined: the way to the board. */
  .home .h-cta {
    grid-area: cta; display: flex; align-items: center; justify-content: center; gap: 0.6em; height: calc(56 * var(--u));
    padding: 0 calc(36 * var(--u)); font-size: calc(18 * var(--u)); font-weight: 600; letter-spacing: 0.02em;
    box-shadow: var(--key-ring); white-space: nowrap;
  }
  .home .h-cta.fill { background: var(--ink); color: var(--bg); box-shadow: none; }
  /* Offline: the control's place, kept, dashed and dimmed: no control. */
  .home .h-cta.off { box-shadow: none; outline: 1px dashed var(--faint); outline-offset: -1px; color: var(--muted); font-weight: 400; }
  .home .hero:active .h-cta.fill { background: var(--go-press); }
  .home .h-cta svg { display: block; height: 0.8em; width: auto; aspect-ratio: 9.5 / 16.5; overflow: visible; }
  .home .h-cta svg path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- 3. Next lesson and Levels ---------- */
  /* One anatomy, at every size: the title and the line under it at the
     top left; at the bottom right, on one baseline at one size (the play
     screen's digits, small), the tile's figure: Next lesson's sample, the
     lock, or the check and best; Levels' finished count, "4/7". No
     chevrons. */
  .home .second { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); margin-top: var(--gap); }
  .home .tile {
    position: relative; display: flex; flex-direction: column; justify-content: space-between;
    --tp-r: calc(16 * var(--u)); --tp-b: calc(16 * var(--u));
    width: 100%; height: calc(104 * var(--u)); margin: 0; padding: calc(18 * var(--u)) var(--tp-r) var(--tp-b) calc(16 * var(--u));
    border: 0; border-radius: 0; background: transparent; box-shadow: var(--key-ring);
    font: inherit; color: var(--ink); text-align: left; cursor: pointer; touch-action: manipulation; min-width: 0;
  }
  .home .tile:active { background: var(--key-press); }
  .home .t-txt { display: flex; flex-direction: column; gap: calc(9 * var(--u)); min-width: 0; }
  .home .t-title, .home .t-name { display: block; text-box: trim-both cap alphabetic; white-space: nowrap; }
  .home .t-title { font-size: calc(16 * var(--u)); font-weight: 600; letter-spacing: 0.01em; }
  .home .t-name { font-size: calc(13 * var(--u)); letter-spacing: 0.02em; color: var(--muted); }
  .home .t-name.ink { color: var(--ink); }
  /* The figure is pinned to the padding corner, so its baseline is the
     same in both tiles whatever the lines above it hold. */
  .home .x { position: absolute; right: var(--tp-r); bottom: var(--tp-b); font-size: calc(28 * var(--u)); gap: 0.3em; }
  .home .x.frac { gap: 0.08em; }
  .home .x .tick { display: block; align-self: flex-end; height: 0.62em; width: auto; aspect-ratio: 20 / 14.5; overflow: visible; color: var(--good); margin-right: 0.05em; }
  /* Locked: the lock and "Log in" together, right-aligned on the
     figure's baseline, a little smaller than the digits; all finished,
     the check and best at that size too, clear of the left padding. */
  .home .x.lockslot, .home .x.best { font-size: calc(24 * var(--u)); }
  .home .x.lockslot { display: flex; align-items: flex-end; gap: 0.3em; font-weight: 500; line-height: 1; white-space: nowrap; }
  .home .x.lockslot > span { display: block; text-box: trim-both cap alphabetic; }
  .home .lock { display: block; flex: none; height: 0.9em; width: auto; aspect-ratio: 16.7 / 20.7; overflow: visible; color: var(--ink); }
  .home .lock path, .home .lock rect { fill: none; stroke: currentColor; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Today's board and Progress: one section ---------- */
  /* Under one faint rule, each with the same heading (sentence case, the
     tile title's weight), rows the same height. */
  .home .extra { display: grid; row-gap: calc(20 * var(--u)); margin-top: calc(24 * var(--u)); padding-top: calc(16 * var(--u)); border-top: 1px solid var(--faint); }
  .home .part { min-width: 0; }
  .home .sh { display: flex; justify-content: space-between; align-items: center; height: 1cap; margin: 0 0 calc(14 * var(--u)); font-size: calc(15 * var(--u)); }
  .home .sh-title { margin: 0; font-size: inherit; font-weight: 600; letter-spacing: 0.01em; color: var(--ink); white-space: nowrap; text-box: trim-both cap alphabetic; }
  .home .sh-title .count { font-weight: 400; color: var(--muted); }
  /* Before the try, the board is a button: "Full board", the way back's
     link, its faint underline under the words alone, the chevron clear of
     it. After the try the hero's control is the way to the board. */
  .home .more { display: flex; align-items: center; gap: 0.45em; font-size: calc(14 * var(--u)); letter-spacing: 0.02em; color: var(--muted); white-space: nowrap; }
  .home .more .link { text-decoration: underline; text-decoration-color: var(--faint); text-decoration-thickness: 1px; text-underline-offset: 0.3em; }
  @media (hover: hover) { .home .bd:hover .more .link { text-decoration-color: currentColor; } }
  .home .more svg { display: block; width: auto; height: 0.75em; aspect-ratio: 9.5 / 16.5; overflow: visible; }
  .home .more path { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

  /* The rows as the full board sets them: place, name, score; your row
     the one outline, at the title's weight. */
  .home .bd {
    display: block; width: 100%; margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent;
    font: inherit; color: var(--ink); text-align: left;
  }
  button.bd { cursor: pointer; touch-action: manipulation; }
  button.bd:active ol { background: var(--key-press); }
  .home .bd ol { list-style: none; margin: 0; padding: 0; }
  .home .r {
    display: grid; grid-template-columns: 2ch minmax(0, 1fr) auto; column-gap: calc(16 * var(--u)); align-items: center;
    height: var(--row-h); padding: 0 calc(16 * var(--u)) 0 calc(10 * var(--u)); font-size: calc(16 * var(--u)); letter-spacing: 0.02em; white-space: nowrap;
  }
  .home .r .place { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .home .r .who { overflow: hidden; text-overflow: ellipsis; }
  .home .r .score { text-align: right; font-variant-numeric: tabular-nums; }
  .home .r.you { box-shadow: var(--key-ring); font-weight: 600; }
  .home .r.you .place { font-weight: 400; }
  .home .r.below { margin-top: calc(6 * var(--u)); }
  /* Nobody yet, or offline: a dashed faint frame round the note. */
  .home .none { display: flex; align-items: center; justify-content: center; height: calc(4 * var(--row-h) + 6 * var(--u)); padding: 0 calc(24 * var(--u)); outline: 1px dashed var(--faint); outline-offset: -1px; }
  .home .note { margin: 0; font-size: calc(15 * var(--u)); letter-spacing: 0.02em; color: var(--muted); text-align: center; text-wrap: balance; line-height: 1.5; }

  /* Progress: a row per topic, as the board's rows: its name, a bar of one
     segment per built level (the run bar's segments, 2px apart: green
     finished, faint not), and "1 of 2". The names take the longest's
     room, so the bars line up. */
  .home .pg { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; column-gap: calc(16 * var(--u)); }
  .home .pc { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: center; height: var(--prog-h); min-width: 0; }
  .home .pc .topic, .home .pc .of { display: block; text-box: trim-both cap alphabetic; white-space: nowrap; }
  .home .pc .topic { font-size: calc(15 * var(--u)); letter-spacing: 0.02em; }
  .home .pc .of { justify-self: end; font-size: calc(14 * var(--u)); letter-spacing: 0.02em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .home .pc .bar { display: flex; gap: 2px; }
  .home .pc .bar span { flex: 1; height: calc(7 * var(--u)); background: var(--faint); }
  .home .pc .bar span.done { background: var(--good); }

  /* ---------- Wide windows: two columns ---------- */
  /* The wordmark, then the hero on the left and the two tiles stacked on
     the right, as tall as the hero; under the rule the board under the
     hero and progress under the tiles, as tall as the board's rows.
     Designed at 1000×640. The column grows steadily with the window,
     60% of it and 260px, never nearer than 24px to its sides, unless the
     window is too short for it. */
  @media (min-width: 900px) {
    body.at-home, body.at-settings {
      --href: 650; --u: clamp(0.6px, min(min(100vw - 48px, 60vw + 260px) / 1000, 100dvh / var(--href)), 1.6px); --cw: calc(1000 * var(--u));
    }
    body.at-home .home, body.at-settings .settings { padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right)); }
    .home .stack {
      --hero-h: calc(264 * var(--u)); --row-h: calc(36 * var(--u)); --prog-h: var(--row-h); --gap: calc(16 * var(--u));
      grid-template-columns: minmax(0, 600fr) minmax(0, 376fr); column-gap: calc(24 * var(--u));
      grid-template-areas: "mark mark" "hero second" "extra extra"; padding: calc(38 * var(--u)) 0 calc(18 * var(--u));
    }
    .home .markrow { grid-area: mark; margin-bottom: calc(30 * var(--u)); }
    .home .mark { font-size: calc(66 * var(--u)); }
    .home .gear { width: calc(36 * var(--u)); height: calc(36 * var(--u)); }
    /* Before the try: the title and the date across the top, then on the
       left the line under it and Start, the text column's width; the
       sample on the right. */
    .home .hero {
      grid-area: hero; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr auto;
      grid-template-areas: "title date" "sub big" ". big" "cta big"; align-items: start; column-gap: calc(32 * var(--u));
      padding: calc(32 * var(--u)) calc(32 * var(--u));
    }
    .home .h-title { font-size: calc(28 * var(--u)); }
    .home .h-date { font-size: calc(18 * var(--u)); }
    .home .h-sub { display: block; grid-area: sub; margin-top: calc(20 * var(--u)); font-size: calc(18 * var(--u)); letter-spacing: 0.02em; color: var(--muted); }
    .home .h-big, .home .hero:not(.done) .h-big { grid-area: big; align-self: center; justify-self: end; margin-top: calc(16 * var(--u)); }
    .home .eqs { font-size: calc(100 * var(--u)); }
    .home .h-cta { justify-self: stretch; height: calc(76 * var(--u)); font-size: calc(22 * var(--u)); }
    /* Done: a scoreboard. The title and the date across the top, the time
       large at the left, "Done" and the place and the control across the
       foot. */
    .home .hero.done { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto 1fr auto; grid-template-areas: "title date" "big big" "place cta"; align-items: center; }
    .home .res .time { grid-area: big; justify-self: start; font-size: calc(96 * var(--u)); }
    .home .res .place { grid-area: place; justify-self: start; font-size: calc(19 * var(--u)); }
    .home .hero.done .h-cta { justify-self: end; height: calc(64 * var(--u)); min-width: calc(240 * var(--u)); font-size: calc(20 * var(--u)); }
    .home .second { grid-area: second; grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); height: var(--hero-h); margin-top: 0; }
    .home .tile { --tp-r: calc(28 * var(--u)); --tp-b: calc(24 * var(--u)); height: auto; padding: calc(22 * var(--u)) var(--tp-r) var(--tp-b) calc(28 * var(--u)); }
    .home .t-txt { gap: calc(10 * var(--u)); }
    .home .t-title { font-size: calc(22 * var(--u)); }
    .home .t-name { font-size: calc(16 * var(--u)); }
    .home .x { font-size: calc(36 * var(--u)); }
    .home .x.lockslot, .home .x.best { font-size: calc(30 * var(--u)); }
    .home .extra { grid-area: extra; grid-template-columns: subgrid; margin-top: calc(28 * var(--u)); padding-top: calc(24 * var(--u)); }
    .home .sh { font-size: calc(18 * var(--u)); margin-bottom: calc(16 * var(--u)); }
    .home .more { font-size: calc(16 * var(--u)); }
    .home .r { font-size: calc(18 * var(--u)); }
    .home .note { font-size: calc(17 * var(--u)); }
    .home .pg { column-gap: calc(20 * var(--u)); }
    .home .pc .topic { font-size: calc(18 * var(--u)); }
    .home .pc .bar span { height: calc(8 * var(--u)); }
    .home .pc .of { font-size: calc(17 * var(--u)); }
  }

  /* ---------- A phone held sideways: three columns ---------- */
  /* The wordmark over the hero, the tiles stacked, the board and progress
     under their rule; designed at 812×380. */
  @media (orientation: landscape) and (max-height: 560px) and (min-aspect-ratio: 3/2) {
    body.at-home, body.at-settings { --href: 380; --u: clamp(0.6px, min((100vw - 32px) / 812, 100dvh / var(--href)), 1.3px); --cw: calc(812 * var(--u)); }

<body class="at-home" data-kind="fact">

        <svg class="sep" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>

      <svg viewBox="2 3 20 18" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>
    </div>
    <button class="acct" type="button">Log in</button>

  <!-- Home, filled in below. -->
  <div class="home" role="region" aria-label="Home">
    <div class="stack">
      <div class="markrow">
        <h1 class="mark">MathTime<span class="cur" aria-hidden="true"></span></h1>
        <!-- The gear (Tabler's "settings"), its viewBox cropped to its ink, stroke included. -->
        <button class="gear" type="button" aria-label="Settings"><svg viewBox="2.25 2.25 19.5 19.5" aria-hidden="true"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37c1 .608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg></button>

  <!-- Settings. -->

      <section class="sect" aria-labelledby="s-acct">

  <!-- The game's own page (index.html), for ?state=levels. -->

          <input id="f-name" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" enterkeyhint="next" aria-describedby="f-error">

<script type="module">
  const params = new URLSearchParams(location.search);
  const state = params.get('state') ?? 'before';
  const ME = 'nate';
  const $ = sel => document.querySelector(sel);
  const body = document.body;
  const { LEVELS, levelName } = await import('/src/levels.js');
  const { formatTime } = await import('/src/finish.js');
  const { fontsReady } = await import('/src/fonts.js');

  // ---------- Each state's player ----------
  // Which levels (by build order, n) are finished, with their best times;
  // signed in or out; today's try; the board.
  const BESTS = { 1: 72_400, 2: 81_900, 3: 95_300, 4: 88_100, 5: 101_700, 6: 124_800, 7: 108_300 };
  const finishedOf = {
    before: [1, 2], after: [1, 2, 3, 4], empty: [1, 2], offline: [1, 2, 3, 4],
    'all-done': [1, 2, 3, 4, 5, 6, 7], locked: [1, 2, 3, 4], levels: [1, 2, 3, 4],
  };
  const signedOut = ['before', 'locked', 'settings-out'].includes(state);
  const finished = new Set(finishedOf[state] ?? [1, 2]);
  const LAST_PLAYED = 7;                       // all-done: Subtraction 3
  const tried = ['after', 'offline'].includes(state);
  const DAY = new Date(2026, 10, 17).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).replace(',', '');
  const NINE = [
    { name: 'alex', totalMs: 58_700 }, { name: 'bea', totalMs: 61_900 }, { name: 'jonah', totalMs: 64_200 },
    { name: 'priya', totalMs: 69_000 }, { name: ME, totalMs: 72_600 }, { name: 'theo', totalMs: 79_600 },
    { name: 'kit', totalMs: 84_100 }, { name: 'rowan', totalMs: null, reached: 12 }, { name: 'ivy', totalMs: null, reached: 5 },
  ];
  const SIX = NINE.filter(p => p.name !== ME).slice(0, 6);
  const TICK = '<svg class="tick" viewBox="2 5 20 14.5" aria-hidden="true"><path d="M3.5 12.5l5.5 5.5l11.5-11.5"/></svg>';
  const LOCK = '<svg class="lock" viewBox="-0.35 -0.35 16.7 20.7" aria-hidden="true"><path d="M4 9V5a4 4 0 0 1 8 0v4"/><rect x="1" y="9" width="14" height="10" rx="1"/><path d="M8 13v2"/></svg>';
  const CHEV = '<svg viewBox="7.75 3.75 9.5 16.5" aria-hidden="true"><path d="M9 5l7 7l-7 7"/></svg>';
  const eq = (a, op, b, cls) => `<span class="${cls} eqs" aria-hidden="true"><span>${a}</span><span class="op">${op}</span><span>${b}</span></span>`;
  const txt = (title, ...names) => `<span class="t-txt"><span class="t-title">${title}</span>`
    + names.map(n => `<span class="t-name">${n}</span>`).join('') + '</span>';

  // ---------- Home ----------
  function showHome() {
    body.className = 'at-home';
    // Daily challenge, the hero: the title and the date in every state.
    // Before the try: a sample from the day's mix and Start. After: the
    // time large, the check and "Done" and the place, and "Full board",
    // the one way to the board. Offline after the try: no place and no
    // control, and no button.
    let hero = $('.hero');
    const top = `<span class="h-title">Daily challenge</span><span class="h-date">${DAY}</span>`;
    if (!tried) {
      hero.innerHTML = top + '<span class="h-sub">20 problems · one try</span>'
        + eq(7, '×', 8, 'h-big') + '<span class="h-cta fill">Start</span>';
      hero.setAttribute('aria-label', `Daily challenge, ${DAY}: 20 problems, one try. Start`);
    } else {
      const offline = state === 'offline';
      if (offline) {
        const div = document.createElement('div');
        div.className = hero.className;
        div.setAttribute('role', 'group');
        hero.replaceWith(div);
        hero = div;
      }
      hero.classList.add('done');
      hero.innerHTML = top + `<span class="h-big res"><span class="time">1:12.6</span>`
        + `<span class="place"><span class="ok">${TICK}Done</span>${offline ? '' : '<span>· 5th of 9 today</span>'}</span></span>`
        + (offline ? '<span class="h-cta off">Full board · offline</span>' : `<span class="h-cta">Full board${CHEV}</span>`);
      hero.setAttribute('aria-label', `Daily challenge, ${DAY}: done, 1:12.6${offline ? '' : ', 5th of 9. Show the full board'}`);
    }
    // Next lesson: the first unfinished level in level order, its sample;
    // locked, "Log in to play" under the name and the lock. With all
    // finished, "Last played", its check and best. Levels: how many are
    // finished.
    const next = $('.tile.next');
    const left = LEVELS.find(l => !finished.has(l.n));
    const level = left ?? LEVELS.find(l => l.n === LAST_PLAYED);
    const locked = signedOut && level.n >= 5;
    let right = eq(level.sample[0], level.op, level.sample[1], 'x');
    if (!left) right = `<span class="x eqs best" aria-hidden="true">${TICK}<span>${formatTime(BESTS[level.n])}</span></span>`;
    else if (locked) right = `<span class="x lockslot" aria-hidden="true">${LOCK}<span>Log in</span></span>`;
    const title = left ? 'Next lesson' : 'Last played';
    next.innerHTML = txt(title, levelName(level)) + right;
    next.setAttribute('aria-label', `${title}: ${levelName(level)}${locked ? ', locked: log in to play' : ''}`);
    const levels = $('.tile.levels');
    levels.innerHTML = txt('Levels', 'Finished so far')
      + `<span class="x eqs frac" aria-hidden="true"><span>${finished.size}</span><span class="op">/</span><span class="op">${LEVELS.length}</span></span>`;
    levels.setAttribute('aria-label', `Levels: ${finished.size} of ${LEVELS.length} finished`);

    // Today's board: the top three, then your row if you're lower. Before
    // the try it is a button, "Full board" at the heading's right; after,
    // the hero's control is the way there, and the heading counts the day.
    const slot = $('.board-slot');
    const players = state === 'after' ? NINE : SIX;
    const link = !tried && state !== 'empty';
    const heading = '<span class="sh"><span class="sh-title" id="h-board" role="heading" aria-level="2">Today’s board'
      + (state === 'offline' ? '' : `<span class="count"> · ${state === 'empty' ? 0 : players.length} played</span>`) + '</span>'
      + (link ? `<span class="more" aria-hidden="true"><span class="link">Full board</span>${CHEV}</span>` : '') + '</span>';
    if (state === 'empty' || state === 'offline') {
      slot.innerHTML = heading + `<div class="none"><p class="note">${state === 'empty' ? 'No scores yet today' : 'The board will show when you’re back online'}</p></div>`;
    } else {
      const row = (p, place) => `<li class="r${p.name === ME ? ' you' : ''}"${p.name === ME ? ' aria-current="true"' : ''}>`
        + `<span class="place">${place}</span><span class="who">${p.name}</span><span class="score">${p.totalMs == null ? `Out at ${p.reached}` : formatTime(p.totalMs)}</span></li>`;
      let html = players.slice(0, 3).map((p, i) => row(p, i + 1)).join('');
      const mine = players.findIndex(p => p.name === ME);
      if (mine >= 3) html += row(players[mine], mine + 1).replace('class="r you"', 'class="r you below"');
      slot.innerHTML = link ? `<button class="bd" type="button" aria-label="Today’s board: show it all">${heading}<ol>${html}</ol></button>`
        : `<div class="bd">${heading}<ol>${html}</ol></div>`;
    }

    // Progress: a topic per cell, its built levels.
    const topics = [...new Set(LEVELS.map(l => l.topic))];
    $('.pg').innerHTML = topics.map(t => {
      const of = LEVELS.filter(l => l.topic === t), done = of.filter(l => finished.has(l.n)).length;
      return `<div class="pc"><span class="topic">${t}</span>`
        + `<span class="bar" role="img" aria-label="${done} of ${of.length} finished">${of.map((l, i) => `<span${i < done ? ' class="done"' : ''}></span>`).join('')}</span>`
        + `<span class="of" aria-hidden="true">${done} of ${of.length}</span></div>`;
    }).join('');
    $('.gear').addEventListener('click', () => { location.search = signedOut ? '?state=settings-out' : '?state=settings-in'; });
    $('.tile.levels').addEventListener('click', () => { location.search = '?state=levels'; });
  }

  // ---------- Settings ----------
  function showSettings() {
    body.className = 'at-settings';
    const who = $('.settings .who'), buttons = $('.settings .buttons');
    if (state === 'settings-in') {
      who.innerHTML = `Logged in as <b>${ME}</b>`;
      buttons.classList.add('one');
      buttons.innerHTML = '<button type="button">Log out</button>';
    } else {
      who.textContent = 'Not logged in';
      who.classList.add('out');
      buttons.innerHTML = '<button type="button" class="fill">Log in</button><button type="button">Sign up</button>';
    }
    $('.crumbs .back').addEventListener('click', e => { e.preventDefault(); location.search = signedOut ? '?state=before' : '?state=after'; });
  }

  // ---------- Levels: the game's own selector, without the tile ----------
  async function showLevels() {
    const mem = new Map();
    const shim = {
      getItem: k => (mem.has(k) ? mem.get(k) : null), setItem: (k, v) => { mem.set(k, String(v)); },
      removeItem: k => { mem.delete(k); }, clear: () => mem.clear(),
      key: i => [...mem.keys()][i] ?? null, get length() { return mem.size; },
    };
    Object.defineProperty(window, 'localStorage', { value: shim, configurable: true });
    const done = [...finished];
    shim.setItem('mathtime.runs', JSON.stringify(done.map(n => ({ id: `r${n}`, level: n, totalMs: BESTS[n], misses: 0, problems: [] }))));
    shim.setItem('mathtime.outbox', '[]');
    shim.setItem('mathtime.account', JSON.stringify({ name: ME }));
    shim.setItem('mathtime.best', JSON.stringify({ name: ME, best: Object.fromEntries(done.map(n => [n, BESTS[n]])) }));
    const json = (status, b) => new Response(JSON.stringify(b), { status, headers: { 'Content-Type': 'application/json' } });
    window.fetch = async (url) => {
      const path = new URL(url, location.href).pathname;
      if (path === '/api/me') return json(200, { name: ME });
      if (path === '/api/best') return json(200, Object.fromEntries(done.map(n => [n, BESTS[n]])));
      return json(404, {});
    };
    body.className = 'at-select under-home';
    $('.crumbs .here').textContent = 'Levels';
    await import('/src/main.js');
    // The game keeps its own body classes; keep this one with them.
    new MutationObserver(() => { if (!body.classList.contains('under-home')) body.classList.add('under-home'); })
      .observe(body, { attributes: true, attributeFilter: ['class'] });
    $('.crumbs .back').addEventListener('click', e => { e.preventDefault(); location.search = '?state=after'; }, true);
  }

  // ---------- The state asked for ----------
  if (state === 'levels') {
    await showLevels();
    await fontsReady();
    await new Promise(r => setTimeout(r, 300));
  } else {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;top:0;left:0;width:100px;height:100px;overflow:scroll;visibility:hidden';
    body.append(probe);
    document.documentElement.classList.toggle('scrollbars-take-room', probe.offsetWidth - probe.clientWidth > 0);
    probe.remove();
    if (state.startsWith('settings')) showSettings(); else showHome();
    await fontsReady();
    document.documentElement.classList.remove('loading');
  }
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
