<!-- Levels 6–7 (batch plan 2026-11-05-column-methods-batch.md): column
     addition with carrying and column subtraction with borrowing, on the
     game's own styles and code (src/), with the column board of the
     2026-10-21 explorations brought up to today's play screen. Served by
     the dev server.
       ?view=select          the level selector with all seven rows (the
                             default view), grouped by topic
         &done=1,2,..        those levels finished, each with a best time
         &current=N          that level marked as the one you came from
       ?view=finish&level=N  Level N's finish screen
         &new=1              with a new best
       ?view=play&level=N    Level N's play screen (6 or 7; 6 unless given)
         &a=..&b=..          with that first problem (its sample unless given)
         &q=N                as question N of 20 (N − 1 segments filled)
         &state=empty|partial|wrong|done   a fixed state for review (the
                             caret holds still)
       Keys: digits, Backspace, Enter (check the column), arrows (move in
       the column), Up (borrow, Level 7), Esc (back to the levels). Tapping
       a cell of the current column moves the cursor there; in Level 7,
       tapping the tens digit borrows. -->
<link rel="stylesheet" href="/src/styles.css">
<style>
  /* ---------- As the Levels 3–5 batch ---------- */
  .select .row + .row { margin-top: 12px; }
  @media (max-width: 359.98px) { .select .sample { font-size: 24px; } }

  /* ---------- The column board ----------
     Everything on the board is placed by the script below, in px from the
     board's top left corner, which sits on a whole device pixel. Columns are
     a strict grid: every answer cell is Level 1's box for one digit (sized
     from the measured digit ink, equal padding, the border outside it), and
     the digits above are centred on their ink in the same columns. */
  .stage { position: relative; }
  .board { position: absolute; left: 0; top: 0; font-weight: 500; --sk: 12px; }
  .board .t { position: absolute; left: 0; top: 0; display: block; height: 1em; line-height: 1; white-space: pre; }
  .dg { color: var(--ink); transition: color .15s; }
  .board .op, .qlabel { color: var(--muted); }
  .qlabel { letter-spacing: 0.04em; }
  .rule { position: absolute; background: var(--ink); }

  /* A cell: its frame, its digit and its caret. A solid frame is a cell you
     always write in. A dashed one is written in only if the working needs
     it: the carry or borrow cell, and the hundreds of a sum. A dashed answer
     cell is inked solid once you write in it; a dashed cell left empty is
     rubbed out once its column checks right, as are the frames round carries
     and borrows, so the finished working reads as it would on paper. */
  .board .cell { position: absolute; display: block; --line: var(--ink); --dash: rgba(238, 245, 255, 0.55); z-index: 1; }
  .board .cell.ok { --line: var(--good); --dash: rgba(143, 240, 192, 0.55); z-index: 0; }
  .board .cell.focus { z-index: 2; }
  .cell .frame { position: absolute; inset: 0; border: var(--bw) solid var(--line); transition: border-color .15s, opacity .2s; }
  .cell.opt .frame, .cell.small .frame { border: 1px dashed var(--dash); }
  .cell.opt.filled .frame { border: var(--bw) solid var(--line); }
  .cell .v { color: var(--ink); }
  .cell.focus .v { color: var(--amber); }        /* a written cell you moved back to: typing replaces it */
  .cell.ok .v { color: var(--good); transition: color .15s; }
  .cell.ok.small .frame, .cell.ok.opt:not(.filled) .frame { opacity: 0; }
  .board .caret { position: absolute; background: var(--amber); visibility: hidden; min-width: 0; animation: blink 1.06s steps(1) infinite; }
  body.typing .cell.focus:not(.filled) .caret { visibility: visible; }
  html.fixed .board .caret { animation: none; }

  /* Borrowing: the struck digit, the stroke through it, the small 1. */
  .dg.struck { color: var(--muted); }
  .strike { position: absolute; overflow: visible; pointer-events: none; opacity: 0; transition: opacity .15s; }
  .strike line { stroke: var(--ink); stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 1; transition: stroke-dashoffset .18s ease-out, stroke .15s; }
  .strike.on { opacity: 1; transition: none; }
  .strike.on line { stroke-dashoffset: 0; }
  .strike.ok line { stroke: var(--good); }
  .small1 { opacity: 0; transition: opacity .15s, color .15s; }
  .small1.on { opacity: 1; }
  .small1.ok { color: var(--good); }
  .hit { position: absolute; cursor: pointer; }
  .cue path { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* Feedback: the column's cells shake as Level 1's equation does. */
  .board .shake { animation: colshake .32s ease; }
  @keyframes colshake {
    0%, 100% { translate: 0; }
    20% { translate: calc(-1 * var(--sk)); }
    40% { translate: calc(0.833 * var(--sk)); }
    60% { translate: calc(-0.5 * var(--sk)); }
    80% { translate: calc(0.333 * var(--sk)); }
  }
  .board.out { animation: out .22s ease-in forwards; }
  .board.in { animation: in .22s ease-out; }

  /* The field that holds focus and takes the keys (the phone's own keyboard
     is suppressed); screen readers hear the cell it is on. */
  .ans { position: absolute; left: 0; top: 0; width: 1px; height: 1px; margin: 0; padding: 0; border: 0; opacity: 0; font-size: 16px; caret-color: transparent; pointer-events: none; }
</style>

  <main class="stage" id="stage">

    <button tabindex="-1" data-k="Backspace" aria-label="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(-0.5 0)"><path d="M20 6H9l-5 6l5 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M12.25 10.25l3.5 3.5m0-3.5l-3.5 3.5"/></g></svg></button>
    <button tabindex="-1" data-k="0"><span class="kl">0</span></button>
    <button tabindex="-1" data-k="Enter" class="go" aria-label="Check the column"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5l5.5 5.5l11.5-11.5"/></svg></button>
  </div>

<script type="module">
  import { LEVELS } from '/src/levels.js';
  import { fontsReady } from '/src/fonts.js';
  import { createScanner } from '/src/scanner.js';
  import { snap, onLayoutGrid } from '/src/ink.js';
  import { fitHeader } from '/src/header.js';
  import { centreKeys } from '/src/keypad.js';
  import { createSelector } from '/src/selector.js';
  import { createFinish, finishText } from '/src/finish.js';

  /* ================= The two levels ================= */
  const rnd = n => Math.floor(Math.random() * n);
  const num = s => s === '' ? 0 : Number(s);

  // Level 6: column addition with carrying. The third column holds the "+"
  // beside the second number and the hundreds of the answer.
  const ADD = {
    n: 6, topic: 'Addition', name: 'Column addition', op: '+', word: 'plus', sample: [47, 38],
    // Played in turn after the first: a carry and a hundreds; no carry; a
    // hundreds without a carry; a carry that makes a 0 in the tens.
    examples: [[47, 38], [75, 38], [23, 41], [56, 71], [68, 32]],
    // Half the problems carry in the ones (batch plan).
    random() {
      const carry = Math.random() < 0.5;
      for (;;) {
        const a = 10 + rnd(90), b = 10 + rnd(90);
        if ((a % 10 + b % 10 >= 10) === carry) return { a, b };
      }
    },
    solve(a, b) {
      const a1 = Math.floor(a / 10), a0 = a % 10, b1 = Math.floor(b / 10), b0 = b % 10;
      const ones = a0 + b0, carry = ones >= 10 ? 1 : 0, tens = a1 + b1 + carry;
      return { O: ones % 10, C: carry, T: tens % 10, H: tens >= 10 ? 1 : 0 };
    },
    // Solid: always written in. Dashed: written in if the working needs it,
    // there for every problem, so they give nothing away.
    cells: [
      { id: 'H', kind: 'big', col: 0, opt: true, name: 'Hundreds, answer' },
      { id: 'T', kind: 'big', col: 1, name: 'Tens, answer' },
      { id: 'O', kind: 'big', col: 2, name: 'Ones, answer' },
      { id: 'C', kind: 'small', col: 1, name: 'Tens, carry' },
    ],
    // A column at a time, right to left; in each, the digit, then where its
    // ten goes: up over the tens out of the ones, straight into the hundreds
    // out of the tens. Leaving that cell empty says "nothing to carry".
    steps: [
      { cells: ['O', 'C'], name: 'Ones', nav: { O: { ArrowUp: 'C', ArrowLeft: 'C' }, C: { ArrowDown: 'O', ArrowRight: 'O' } } },
      { cells: ['T', 'H'], name: 'Tens', nav: { T: { ArrowLeft: 'H' }, H: { ArrowRight: 'T' } } },
    ],
    order: k => ADD.steps[k].cells,
    // A column is right when its digit and its carry both are (a skipped
    // carry is wrong). A 0 carry may be written or left out.
    // The cells of column k that are wrong, in working order: none means
    // the column is right.
    wrong(k, v, x) {
      if (k === 0) return [v.O !== x.O + '' && 'O', num(v.C) !== x.C && 'C'].filter(Boolean);
      return [v.T !== x.T + '' && 'T', num(v.H) !== x.H && 'H'].filter(Boolean);
    },
    fixed(name, x) {
      const ones = { O: String(x.O), C: x.C ? '1' : '' };
      if (name === 'partial') return { v: ones, done: [true, false], k: 1, f: 'T' };
      // The ones written with the carry skipped: Enter is pressed on load.
      if (name === 'wrong') return { v: { O: String(x.O) }, f: 'C', press: 'Enter' };
      return { v: { ...ones, T: String(x.T), H: x.H ? '1' : '' }, done: [true, true], k: 2, f: null, phase: 'done' };
    },
  };

  // Level 7: column subtraction with borrowing (decomposition), the "−" in
  // the third column.
  const borrowed = (v, f) => v.B !== '' || f === 'B';
  const SUB = {
    n: 7, topic: 'Subtraction', name: 'Column subtraction', op: '−', word: 'minus', sample: [52, 27],
    // After the first: none; a borrow from a 0 in the ones; a borrow that
    // leaves 0 tens; another borrow.
    examples: [[52, 27], [86, 34], [70, 26], [41, 38], [93, 58]],
    random() {
      const borrow = Math.random() < 0.5;               // half need a borrow
      for (;;) {
        const a = 10 + rnd(90), b = 10 + rnd(90);
        if (b <= a && (a % 10 < b % 10) === borrow) return { a, b };
      }
    },
    solve(a, b) {
      const a1 = Math.floor(a / 10), a0 = a % 10, b1 = Math.floor(b / 10), b0 = b % 10;
      const need = a0 < b0;
      return { need, B: a1 - 1, O: a0 + (need ? 10 : 0) - b0, T: a1 - (need ? 1 : 0) - b1 };
    },
    cells: [
      { id: 'T', kind: 'big', col: 1, name: 'Tens, answer' },
      { id: 'O', kind: 'big', col: 2, name: 'Ones, answer' },
      { id: 'B', kind: 'small', col: 1, name: 'Tens, borrow: the new tens digit' },
    ],
    // The ones, then the tens. To borrow, tap the tens digit (or its cell,
    // or press Up): it is struck through and the cursor goes up into the
    // cell over it, where you write what it becomes. A small 1 then goes
    // before the ones digit and the cursor comes back down to the ones
    // answer. Leave the borrow cell empty and the strike is taken back.
    steps: [
      { cells: ['O', 'B'], name: 'Ones', nav: { O: { ArrowUp: 'B' }, B: { ArrowDown: 'O', ArrowRight: 'O' } } },
      { cells: ['T'], name: 'Tens', nav: {} },
    ],
    order: (k, v, f) => k ? ['T'] : borrowed(v, f) ? ['B', 'O'] : ['O'],
    // Backspace in an empty borrow cell takes the borrow back.
    backFromEmpty() {
      if (S.f !== 'B') return 'ignored';
      moveTo(S.v.O === '' ? 'O' : null);
      return 'typed';
    },
    // A borrow made where none is needed is taken back for you: the strike
    // goes, and the ones digit, if right, stays.
    afterWrong(bad) {
      if (S.k !== 0 || S.x.need || bad[0] !== 'B') return null;
      S.f = bad.includes('O') ? 'O' : null;
      return 'no borrow needed';
    },
    // The ones column is right only if it is worked: the borrow made when,
    // and only when, it is needed, the new tens digit right, and the ones
    // digit. A right digit with no borrow is wrong (the level is the method):
    // the borrow cell is the wrong one, and the digit stays.
    wrong(k, v, x) {
      if (k === 1) return v.T !== x.T + '' ? ['T'] : [];
      const borrowWrong = x.need ? v.B !== x.B + '' : v.B !== '';
      return [borrowWrong && 'B', v.O !== x.O + '' && 'O'].filter(Boolean);
    },
    fixed(name, x) {
      const ones = { B: x.need ? String(x.B) : '', O: String(x.O) };
      if (name === 'partial') return x.need ? { v: { B: String(x.B) }, f: 'O' } : { v: { O: String(x.O) }, f: null };
      // The ones digit written without the borrow: Enter is pressed on load.
      if (name === 'wrong') return { v: { O: String(x.O) }, f: null, press: 'Enter' };
      return { v: { ...ones, T: String(x.T) }, done: [true, true], k: 2, f: null, phase: 'done' };
    },
    // The marks of a borrow: a stroke through the tens digit, a small 1
    // before the ones digit, and a tap target over the tens digit and its cell.
    buildExtra() {
      E.strike = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      E.strike.setAttribute('class', 'strike');
      E.strike.setAttribute('aria-hidden', 'true');
      E.line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      E.line.setAttribute('pathLength', '1');
      E.strike.appendChild(E.line);
      board.appendChild(E.strike);
      E.small1 = el('span', 't dg small1');
      // The way to borrow, shown on every problem (so it gives nothing
      // away): an up chevron in the empty borrow cell, as the Up key.
      E.cue = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      E.cue.setAttribute('class', 'cue');
      E.cue.setAttribute('viewBox', '0 0 12 12');
      E.cue.setAttribute('aria-hidden', 'true');
      E.cue.innerHTML = '<path d="M3 7.5L6 4.5l3 3"/>';
      E.cells.B.cell.appendChild(E.cue);
      E.hit = el('i', 'hit');
      E.hit.dataset.tap = 'B';
    },
    placeExtra() {
      const { fs, dpr } = G;
      // The stroke: upper left to lower right, a little past the ink at both
      // ends (less at the top, under the borrow cell), so it crosses the
      // diagonal of a 4 or a 7 instead of running along it.
      const ink = E.inkA[0], e = 0.05 * fs, eTop = 0.05 * fs, sw = Math.max(0.045 * fs, 2);
      const x0 = ink.l - eTop, y0 = ink.t - eTop, x1 = ink.r + e, y1 = ink.b + e, m = sw;
      const left = x0 - m, top = y0 - m, w = x1 - x0 + 2 * m, h = y1 - y0 + 2 * m;
      Object.assign(E.strike.style, { left: px(left), top: px(top), width: px(w), height: px(h) });
      E.strike.setAttribute('viewBox', `0 0 ${w} ${h}`);
      E.line.setAttribute('x1', m); E.line.setAttribute('y1', m);
      E.line.setAttribute('x2', w - m); E.line.setAttribute('y2', h - m);
      E.line.setAttribute('stroke-width', sw);
      // The small 1, on the ones digit's top left corner, as on paper: its
      // baseline 0.09em above the digits' ink, its ink centred on the ones
      // digit's left ink edge. It is sized so its top stays 0.04em below the
      // borrow digit's baseline: the two never sit level, so "4" and "1"
      // don't read as 41. The same for every problem.
      const top2 = G.y1 - G.asc * fs;
      const base1 = snap(top2 - 0.09 * fs, dpr);
      const s1 = Math.min(0.4 * fs, Math.max(14, (base1 - G.ySb - 0.04 * fs) / G.asc));
      const left2 = G.cx[2] - G.W / 2 + G.bw + G.pad;   // the widest digit's ink starts here
      placeText(E.small1, '1', s1, G.style, left2, base1);
      E.cue.style.cssText = `position:absolute;left:${px((G.Ws - 0.6 * G.Ws) / 2)};top:${px((G.Hs - 0.6 * G.Ws) / 2)};width:${px(0.6 * G.Ws)};height:${px(0.6 * G.Ws)}`;
      // The tap target: the tens column, from the top of the borrow cell to
      // below the tens digit.
      Object.assign(E.hit.style, { left: px(G.ox + G.P), top: '0px', width: px(G.W), height: px(G.y1 + G.desc * fs + G.c / 2) });
    },
    updateExtra() {
      const on = borrowed(S.v, S.f);
      E.strike.classList.toggle('on', on);
      E.a[0].classList.toggle('struck', on);
      E.small1.classList.toggle('on', S.v.B !== '');
      E.strike.classList.toggle('ok', S.done[0]);
      E.small1.classList.toggle('ok', S.done[0]);
      E.hit.hidden = S.k !== 0 || S.phase !== 'playing';
      E.cue.style.visibility = S.k === 0 && !on && S.phase === 'playing' ? 'visible' : 'hidden';
    },
  };

  const PROPOSED = [ADD, SUB].map(L => ({ ...L, livesPerProblem: 3, problemsPerRun: 20 }));
  // The selector groups rows by topic, in the order each topic first comes:
  // Level 6 joins Addition, Level 7 Subtraction.
  const all = [...LEVELS, ...PROPOSED.filter(p => !LEVELS.some(level => level.n === p.n))];
  const topics = [...new Set(all.map(level => level.topic))];
  const levels = topics.flatMap(t => all.filter(level => level.topic === t));
  const BEST = { 1: 72_400, 2: 95_000, 3: 101_300, 4: 138_600, 5: 117_900, 6: 214_500, 7: 238_200 };

  /* ================= The page ================= */
  const $ = sel => document.querySelector(sel);
  const stage = $('#stage'), board = $('#board'), ans = $('#ans'), pad = $('.pad'), topBar = $('.top'), statusEl = $('#status'), run = $('.run');
  const hearts = [...document.querySelectorAll('.lives svg')], livesBox = $('.lives');
  const params = new URLSearchParams(location.search);
  const playing = params.get('view') === 'play';
  const finishing = params.get('view') === 'finish';
  const shownN = Number(params.get('level') ?? 6);
  const L = PROPOSED.find(p => p.n === shownN) ?? PROPOSED[0];
  const FINISH_LEVEL = levels.find(level => level.n === shownN) ?? L;
  const toSelector = () => { location.search = `?view=select&current=${playing ? L.n : FINISH_LEVEL.n}`; };
  const scan = createScanner();
  const px = v => onLayoutGrid(v, devicePixelRatio) + 'px';
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  const DIGITS = [...'0123456789'];
  const SMALL = 0.5;          // carry and borrow digits, against the problem's size
  const MAX_FS = 128;         // Level 1's largest equation
  const FIXED = ['empty', 'partial', 'done', 'wrong'].includes(params.get('state')) ? params.get('state') : null;
  if (FIXED) document.documentElement.classList.add('fixed');
  const CELLS = L.cells, STEPS = L.steps;
  const stepOf = Object.fromEntries(STEPS.flatMap((s, k) => s.cells.map(id => [id, k])));

  // The header: this level's place.
  $('.crumbs .topic').textContent = L.topic;
  $('.crumbs .here').textContent = `Level ${L.n}`;
  $('.crumbs .back').href = `?view=select&current=${L.n}`;

  /* ---------- Problems and play state ---------- */
  let example = 0;
  function nextProblem() {
    if (example < L.examples.length) {
      const [a, b] = L.examples[example++];
      return { a, b };
    }
    return L.random();
  }
  const S = { q: Math.min(20, Math.max(1, Number(params.get('q') ?? 1))), lives: 3, p: null, x: null, k: 0, f: null, v: {}, done: [], phase: 'playing' };
  function fresh(p) {
    S.p = p;
    S.x = L.solve(p.a, p.b);
    S.k = 0;
    S.v = Object.fromEntries(CELLS.map(c => [c.id, '']));
    S.done = STEPS.map(() => false);
    S.f = STEPS[0].cells[0];
    S.lives = 3;
    S.phase = 'playing';
  }
  if (params.has('a') && params.has('b')) { fresh({ a: Number(params.get('a')), b: Number(params.get('b')) }); example = 1; }
  else fresh(nextProblem());
  if (FIXED && FIXED !== 'empty') {
    const fixed = L.fixed(FIXED, S.x);
    Object.assign(S.v, fixed.v);
    var pressOnLoad = fixed.press;
    delete fixed.v;
    delete fixed.press;
    Object.assign(S, fixed);
  }

  /* ---------- Measuring ---------- */
  const G = {};
  const baseCache = new Map();
  // The baseline inside a 1em, line-height 1 box, read from the live layout.
  function baseAt(size) {
    const key = `${G.family}|${size}`;
    if (!baseCache.has(key)) {
      const box = document.createElement('span');
      box.style.cssText = `position:absolute;visibility:hidden;display:block;height:1em;line-height:1;white-space:pre;font-size:${size}px`;
      box.innerHTML = '0<span style="display:inline-block;width:0;height:0;vertical-align:baseline"></span>';
      board.appendChild(box);
      baseCache.set(key, (box.lastChild.getBoundingClientRect().top - box.getBoundingClientRect().top) / size);
      box.remove();
    }
    return baseCache.get(key);
  }
  const colour = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const label = () => `Question ${S.q} of 20`;

  // Every size on the board, from the measured digit ink at font size fs,
  // in px from the board's top left, on whole device pixels.
  function measure(fs) {
    const dpr = devicePixelRatio, d = v => snap(v, dpr);
    const cs = getComputedStyle(board);
    Object.assign(G, { dpr, fs, family: cs.fontFamily });
    G.style = { weight: cs.fontWeight, family: cs.fontFamily, color: colour('--ink') };
    G.opStyle = { ...G.style, color: colour('--muted') };
    G.labelStyle = { ...G.opStyle, spacing: 0.04 };
    const inkOf = size => {
      const each = DIGITS.map(c => scan(c, G.style, size * dpr));
      return { asc: Math.max(...each.map(m => m.asc)), desc: Math.max(...each.map(m => m.desc)), w: Math.max(...each.map(m => m.abl + m.abr)) };
    };
    const big = inkOf(fs);
    G.asc = big.asc; G.desc = big.desc;
    G.fsS = fs * SMALL;
    const small = inkOf(G.fsS);
    G.ascS = small.asc; G.descS = small.desc;

    // A big cell is Level 1's box for one digit: the widest digit's ink,
    // 0.1em padding on all four sides, the border outside it. Cells in a row
    // join into one segmented box: neighbours share a border, so the column
    // pitch is a cell's width less one border.
    G.bw = Math.max(1, Math.floor(Math.max(0.025 * fs, 2) * dpr + 1e-3)) / dpr;
    G.pad = d(0.1 * fs);
    G.W = d(big.w * fs) + 2 * (G.pad + G.bw);
    G.P = G.W - G.bw;
    // The operator, in its own column left of the number: its ink 0.5em
    // clear of the widest digit's ink in the tens column, so "+38" and
    // "−27" never read as signed numbers. Where that takes it past the
    // first column's left edge, the board grows to the left by `ox`.
    const opInk = scan(L.op, G.opStyle, fs * dpr);
    const opRight = G.P + G.W / 2 - big.w * fs / 2 - 0.5 * fs;
    G.ox = d(Math.max(0, (opInk.abl + opInk.abr) * fs - opRight));
    G.opRight = G.ox + opRight;
    G.boardW = G.ox + 2 * G.P + G.W;
    G.cx = [0, 1, 2].map(i => G.ox + i * G.P + G.W / 2);

    // A small cell: the same, from the small digits' ink, with a 1px dashed
    // frame, its width differing from a big cell's by an even number of
    // device pixels, so it centres exactly over its column.
    G.bS = 1;
    G.padS = d(0.28 * G.fsS);
    let ws = d(small.w * G.fsS) + 2 * (G.padS + G.bS);
    if (Math.round((G.W - ws) * dpr) % 2) ws += 1 / dpr;
    G.Ws = ws;
    G.ySb = d(G.bS + G.padS + G.ascS * G.fsS);
    G.Hs = d(G.ySb + G.descS * G.fsS + G.padS + G.bS);

    // Rows: the small cells, the two numbers, the rule, the answer. One ink
    // gap (0.365em) between the numbers, to the rule, and from it to the
    // answer cells; the small cells half that above the first number.
    const inkH = (G.asc + G.desc) * fs;
    G.c = d(0.365 * fs);
    G.y1 = d(G.Hs + d(0.5 * G.c) + G.asc * fs);
    G.y2 = G.y1 + d(inkH + G.c);
    G.yL = d(G.y2 + G.desc * fs + G.c);
    G.y3 = d(G.yL + G.bw + G.c + G.bw + G.pad + G.asc * fs);
    G.boxT = d(G.y3 - G.asc * fs - G.pad - G.bw);
    G.boxB = d(G.y3 + G.desc * fs + G.pad + G.bw);
    G.boardH = G.boxB;

    const caretW = (size, cellW) => {
      let w = Math.max(1, Math.round(Math.max(0.05 * size, 2) * dpr));
      if ((Math.round(cellW * dpr) - w) % 2) w += 1;
      return w / dpr;
    };
    G.cw = caretW(fs, G.W);
    G.cwS = caretW(G.fsS, G.Ws);
    G.caretT = Math.floor((G.y3 - G.asc * fs) * dpr + 1e-3) / dpr - G.boxT;
    G.caretB = Math.ceil((G.y3 + G.desc * fs) * dpr - 1e-3) / dpr - G.boxT;
    G.caretTS = Math.floor((G.ySb - G.ascS * G.fsS) * dpr + 1e-3) / dpr;
    G.caretBS = Math.ceil((G.ySb + G.descS * G.fsS) * dpr - 1e-3) / dpr;

    // "Question N of 20", as the play screen's label: its ink centred over
    // the board, a gap above the small cells.
    G.lfs = Math.max(15, 0.16 * fs);
    const lm = scan(label(), G.labelStyle, G.lfs * dpr);
    G.labelH = (lm.asc + lm.desc) * G.lfs;
    G.labelW = (lm.abl + lm.abr) * G.lfs;
    G.gapL = Math.max(0.2 * fs, 18);
  }

  // Fit the board to the problem area: as big as fits, at most Level 1's
  // largest size, between the side gutters (the label too), centred, with
  // "Question N of 20" above it and some air above and below.
  function fit() {
    const gutter = parseFloat(getComputedStyle(stage).getPropertyValue('--gutter')) || 16;
    const across = stage.clientWidth - 2 * gutter - 1;
    const half = stage.clientHeight / 2 - Math.max(12, 0.05 * stage.clientHeight);
    let fs = MAX_FS;
    for (let round = 0; round < 6; round++) {
      measure(fs);
      const s = Math.min(across / Math.max(G.boardW, G.labelW), half / (G.boardH / 2 + G.gapL + G.labelH));
      if (Math.abs(s - 1) < 1e-3 || (s >= 1 && fs >= MAX_FS)) break;
      fs = Math.max(10, Math.min(MAX_FS, fs * s));
    }
  }

  // Put a text element's ink centred on x = cx (or its right or left ink
  // edge on cx), its baseline on `base`. The ink is scanned again at the
  // sub-pixel phase it will be drawn at. Returns its ink box.
  function placeText(node, text, size, style, cx, base, align = 'centre') {
    const dpr = G.dpr;
    const start = m => align === 'right' ? cx - m.abr * size : align === 'left' ? cx + m.abl * size : cx - (m.abr - m.abl) / 2 * size;
    let m = scan(text, style, size * dpr);
    for (let i = 0; i < 3; i++) {
      const phase = Math.round((((start(m) * dpr) % 1) + 1) % 1 * 64) % 64 / 64;
      m = scan(text, style, size * dpr, phase);
    }
    const x = start(m);
    node.textContent = text;
    node.style.fontSize = size + 'px';
    node.style.left = px(x);
    node.style.top = px(base - baseAt(size) * size);
    return { l: x - m.abl * size, r: x + m.abr * size, t: base - m.asc * size, b: base + m.desc * size };
  }

  /* ---------- Drawing ---------- */
  const E = {};
  const el = (tag, cls, parent = board) => {
    const node = document.createElement(tag);
    if (cls) node.setAttribute('class', cls);
    parent.appendChild(node);
    return node;
  };

  function build() {
    board.replaceChildren();
    E.label = el('span', 't qlabel');
    E.a = [0, 1].map(() => el('span', 't dg'));
    E.b = [0, 1].map(() => el('span', 't dg'));
    E.op = el('span', 't op');
    E.rule = el('i', 'rule');
    E.cells = {};
    for (const c of CELLS) {
      const cell = el('div', `cell ${c.kind}${c.opt ? ' opt' : ''}`);
      cell.dataset.tap = c.id;
      el('i', 'frame', cell);
      E.cells[c.id] = { cell, v: el('span', 't v', cell), caret: el('i', 'caret', cell) };
    }
    L.buildExtra?.();
  }

  function place() {
    const { fs, dpr } = G;
    const sr = stage.getBoundingClientRect();
    board.style.left = px(snap(sr.left + sr.width / 2 - G.boardW / 2, dpr) - sr.left);
    board.style.top = px(snap(sr.top + sr.height / 2 - G.boardH / 2, dpr) - sr.top);
    board.style.fontSize = fs + 'px';
    board.style.setProperty('--bw', G.bw + 'px');
    board.style.setProperty('--sk', (0.12 * fs).toFixed(3) + 'px');

    const lm = scan(label(), G.labelStyle, G.lfs * dpr);
    placeText(E.label, label(), G.lfs, G.labelStyle, G.boardW / 2, snap(-G.gapL - lm.desc * G.lfs, dpr));

    const a = String(S.p.a), b = String(S.p.b);
    E.inkA = [...a].map((ch, i) => placeText(E.a[i], ch, fs, G.style, G.cx[i + 1], G.y1));
    E.inkB = [...b].map((ch, i) => placeText(E.b[i], ch, fs, G.style, G.cx[i + 1], G.y2));
    // The operator left of the second number, its ink centred on the digit ink.
    const om = scan(L.op, G.opStyle, fs * dpr);
    const mid = G.y2 + (G.desc - G.asc) / 2 * fs;
    placeText(E.op, L.op, fs, G.opStyle, G.opRight, snap(mid - (om.desc - om.asc) / 2 * fs, dpr), 'right');
    Object.assign(E.rule.style, { left: '0px', top: px(G.yL), width: px(G.boardW), height: px(G.bw) });

    for (const c of CELLS) {
      const { cell, caret } = E.cells[c.id];
      const big = c.kind === 'big';
      const w = big ? G.W : G.Ws, h = big ? G.boxB - G.boxT : G.Hs;
      Object.assign(cell.style, {
        left: px(G.ox + c.col * G.P + (big ? 0 : (G.W - G.Ws) / 2)),
        top: px(big ? G.boxT : 0), width: px(w), height: px(h),
      });
      const cw = big ? G.cw : G.cwS;
      Object.assign(caret.style, {
        left: px((w - cw) / 2), width: px(cw),
        top: px(big ? G.caretT : G.caretTS), height: px(big ? G.caretB - G.caretT : G.caretBS - G.caretTS),
      });
    }
    L.placeExtra?.();
    update();
  }

  // The run bar: a segment filled for each problem done.
  function renderRun() {
    [...run.children].forEach((seg, i) => seg.classList.toggle('done', i < S.q - 1 + (S.phase === 'done' || S.phase === 'correct' ? 1 : 0)));
  }

  // The state into the board: what is written, where the cursor is, what is checked.
  function update() {
    for (const c of CELLS) {
      const { cell, v } = E.cells[c.id];
      const val = S.v[c.id];
      const big = c.kind === 'big';
      cell.classList.toggle('filled', val !== '');
      cell.classList.toggle('focus', S.f === c.id && S.phase === 'playing');
      cell.classList.toggle('ok', S.done[stepOf[c.id]]);
      if (val === '') v.textContent = '';
      else placeText(v, val, big ? G.fs : G.fsS, G.style, (big ? G.W : G.Ws) / 2, big ? G.y3 - G.boxT : G.ySb);
    }
    L.updateExtra?.();
    for (const c of CELLS) for (const anim of E.cells[c.id].caret.getAnimations()) anim.currentTime = 0;
    hearts.forEach((h, i) => h.classList.toggle('lost', i >= S.lives));
    livesBox.setAttribute('aria-label', S.lives === 1 ? '1 life left' : `${S.lives} lives left`);
    const cell = CELLS.find(c => c.id === S.f);
    ans.setAttribute('aria-label', cell ? cell.name : `${STEPS[Math.min(S.k, STEPS.length - 1)].name} column written: Enter checks it`);
    renderRun();
  }

  /* ---------- Playing ---------- */
  const order = () => L.order(S.k, S.v, S.f);
  function moveTo(id) {
    S.f = id;
    update();
  }
  // The next empty cell of the column after `from`, in working order, or
  // none (the column is written: the caret hides until Enter checks it).
  function nextEmpty(from) {
    const o = order(), i = o.indexOf(from);
    for (let j = 1; j <= o.length; j++) {
      const id = o[(i + j) % o.length];
      if (S.v[id] === '') return id;
    }
    return null;
  }

  function press(key) {
    if (S.phase !== 'playing') return 'ignored';
    if (/^\d$/.test(key)) {
      if (!S.f) return 'ignored';
      S.v[S.f] = key;
      S.f = nextEmpty(S.f);
      update();
      return 'typed';
    }
    if (key === 'Backspace') {
      if (S.f && S.v[S.f] !== '') { S.v[S.f] = ''; update(); return 'typed'; }
      const o = order();
      for (let j = (S.f ? o.indexOf(S.f) : o.length) - 1; j >= 0; j--) {
        if (S.v[o[j]] !== '') { S.v[o[j]] = ''; moveTo(o[j]); return 'typed'; }
      }
      return L.backFromEmpty ? L.backFromEmpty() : 'ignored';
    }
    if (key === 'Enter') return check();
    if (key.startsWith('Arrow')) {
      const to = STEPS[S.k].nav[S.f ?? STEPS[S.k].cells[0]]?.[key];
      if (!to) return 'ignored';
      moveTo(to);
      return 'moved';
    }
    return 'ignored';
  }

  function tap(id) {
    if (S.phase !== 'playing' || stepOf[id] !== S.k) return;
    moveTo(id);
  }

  // Enter checks the column you are on; with its answer cell empty nothing
  // happens. Right: green, and the cursor moves on to the next column.
  // Wrong: its cells shake and clear, and a heart is lost.
  function check() {
    const step = STEPS[S.k];
    if (S.v[step.cells[0]] === '') return 'ignored';
    const bad = L.wrong(S.k, S.v, S.x);
    if (!bad.length) {
      S.done[S.k] = true;
      S.k += 1;
      if (S.k === STEPS.length) {
        S.phase = 'correct';
        S.f = null;
        update();
        showCorrect();
        return 'correct';
      }
      S.f = STEPS[S.k].cells[0];
      update();
      statusEl.textContent = `Right. ${STEPS[S.k].name} column.`;
      return 'step';
    }
    // Only the wrong cells shake and clear; what was right stays, and the
    // cursor goes to the first wrong one. A missing borrow starts the borrow.
    S.lives -= 1;
    for (const id of bad) S.v[id] = '';
    S.f = bad[0];
    const what = L.afterWrong?.(bad) ?? CELLS.find(c => c.id === bad[0]).name;
    if (S.lives === 0) S.phase = 'out';
    update();
    shake(bad);
    statusEl.textContent = S.lives ? `Wrong: ${what}. ${livesBox.getAttribute('aria-label')}` : 'Out of lives';
    if (S.lives === 0) wait(450).then(toSelector);
    return S.lives ? 'wrong' : 'out';
  }

  // The column's small cell shakes, and the answer row as one box: its
  // cells share borders, so one cell shaking alone would tear the box.
  function shake(ids) {
    const nodes = new Set();
    for (const id of ids) {
      if (CELLS.find(c => c.id === id).kind === 'small') nodes.add(E.cells[id].cell);
      else for (const c of CELLS) if (c.kind === 'big') nodes.add(E.cells[c.id].cell);
    }
    for (const node of nodes) {
      node.classList.remove('shake');
      void node.offsetWidth;
      node.classList.add('shake');
    }
  }
  board.addEventListener('animationend', e => {
    if (e.animationName === 'colshake') e.target.classList.remove('shake');
  });

  const announce = () => { statusEl.textContent = `Question ${S.q} of 20: ${S.p.a} ${L.word} ${S.p.b}`; };

  // Green for 0.35s, slide out, the next problem slides in. After the 20th,
  // the finish screen.
  async function showCorrect() {
    statusEl.textContent = 'Correct';
    await wait(350);
    if (S.q === 20) { location.search = `?view=finish&level=${L.n}`; return; }
    board.classList.remove('in');
    board.classList.add('out');
    const slide = board.getAnimations().find(anim => anim.animationName === 'out');
    if (slide) await Promise.race([slide.finished.catch(() => {}), wait(1000)]);
    S.q += 1;
    fresh(nextProblem());
    build();
    safeLayout();
    board.classList.remove('out');
    void board.offsetWidth;
    board.classList.add('in');
    announce();
  }

  /* ---------- Input: keypad, keyboard, taps ---------- */
  function bindPlay() {
    const flashes = new Map();
    function flash(key) {
      const btn = pad.querySelector(`button[data-k="${key}"]`);
      if (!btn) return;
      clearTimeout(flashes.get(btn));
      btn.classList.add('pressed');
      flashes.set(btn, setTimeout(() => btn.classList.remove('pressed'), 110));
    }
    const KEYS = new Set(['Enter', 'Backspace', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
    ans.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'Tab') { e.preventDefault(); return; }
      if (e.key === 'Escape') { if (!e.isComposing) toSelector(); return; }
      if (!KEYS.has(e.key) && !/^\d$/.test(e.key)) return;
      e.preventDefault();
      if (press(e.key) !== 'ignored') flash(e.key);
    });
    ans.addEventListener('beforeinput', e => e.preventDefault());
    ans.addEventListener('focus', () => document.body.classList.add('typing'));
    ans.addEventListener('blur', () => document.body.classList.remove('typing'));
    pad.addEventListener('click', e => {
      const btn = e.target.closest('button[data-k]');
      if (btn) press(btn.dataset.k);
    });
    // Focus always stays in the field: taps never take it.
    const keep = () => ans.focus({ preventScroll: true });
    document.addEventListener('pointerdown', e => {
      const target = e.target.closest('[data-tap]');
      if (target) tap(target.dataset.tap);
      if (e.target !== ans && !e.target.closest('a')) { e.preventDefault(); keep(); }
    });
    document.addEventListener('focusin', e => { if (e.target !== ans && !e.target.closest('a')) keep(); });
    ans.addEventListener('focusout', e => {
      if (e.relatedTarget) return;
      queueMicrotask(() => { if (document.hasFocus() && document.activeElement !== ans) keep(); });
    });
    keep();
  }

  /* ---------- The selector and the finish screen ---------- */
  const done = new Set((params.get('done') ?? '').split(',').filter(Boolean).map(Number));
  const selector = createSelector($('.select'), levels, level => {
    if (PROPOSED.some(p => p.n === level.n)) location.search = `?view=play&level=${level.n}`;
  }, scan);
  selector.showBests(n => done.has(n) ? BEST[n] : null);
  selector.mark(levels.find(level => level.n === Number(params.get('current'))));
  const finish = createFinish($('.finish'), scan, {
    again: () => { location.search = `?view=play&level=${FINISH_LEVEL.n}`; },
    levels: toSelector,
  });
  const text = finishText(FINISH_LEVEL.n, BEST[FINISH_LEVEL.n] + (params.get('new') ? -4_200 : 6_800), 2, BEST[FINISH_LEVEL.n]);
  window.mockup = { S, G, selector, finish, levels };

  /* ---------- Layout ---------- */
  // The run bar's segments on whole device pixels (as layout.js).
  function placeRun() {
    const first = run.firstElementChild;
    if (!first) return;
    const dpr = devicePixelRatio;
    run.style.removeProperty('--run-dx');
    run.style.removeProperty('--run-dy');
    const r = first.getBoundingClientRect();
    run.style.setProperty('--run-dx', px(snap(r.left, dpr) - r.left));
    run.style.setProperty('--run-dy', px(snap(r.top, dpr) - r.top));
  }

  function safeLayout() {
    try {
      baseCache.clear();
      fitHeader(topBar, scan);
      if (playing && stage.clientWidth) {
        fit();
        place();
        centreKeys(pad, scan);
        placeRun();
      }
      if (finishing) finish.place();
    } catch (err) {
      console.error(err);
    }
    try {
      selector.layout();
    } catch (err) {
      console.error(err);
    }
  }
  let queued = false;
  const relayout = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; safeLayout(); });
  };

  if (playing) {
    document.body.classList.remove('at-select');
    run.replaceChildren(...Array.from({ length: 20 }, () => document.createElement('span')));
  }
  if (finishing) {
    document.body.classList.remove('at-select');
    document.body.classList.add('at-finish');
    addEventListener('keydown', e => { if (e.key === 'Escape' && !e.isComposing) toSelector(); });
  }

  fontsReady().then(() => {
    if (playing) build();
    if (finishing) finish.show(text);
    safeLayout();
    document.documentElement.classList.remove('loading');
    const resized = new ResizeObserver(relayout);
    for (const node of [stage, topBar, $('.select')]) resized.observe(node);
    if (playing) {
      bindPlay();
      announce();
      if (pressOnLoad) setTimeout(() => press(pressOnLoad), 150);
    } else if (finishing) {
      statusEl.textContent = text.said;
      finish.focus();
    } else {
      selector.focus();
    }
  });
</script>
</body>
</html>
