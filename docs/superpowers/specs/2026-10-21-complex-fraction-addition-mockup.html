<!--
Fraction addition with unlike denominators (Fractions, exploratory mockup).
Built on the game's own styles and ink scanner (src/). Served by the dev server.
?state=empty|partial|done|wrong  fixed review states    ?random=1  random problems
?p=1/6+1/3  fixes the first problem (this one needs simplifying)

The mechanic (proposal):
- The working is a form: 1/3 + 1/4 = □/□ + □/□ = □/□. Steps still to come are drawn
  as dashed construction boxes; the current step's boxes are solid; done steps settle
  (their boxes fade back to the faint line).
- The common-denominator step is required: it is the method this level teaches.
  Any common denominator is accepted, not only the lowest.
- Cursor order inside a step: denominators first, then numerators, left to right
  (find the common denominator, write it under both bars, then scale the tops).
- Every cell holds up to two digits, one size for the level (Level 1's box rule),
  ink-centred. The cell you are writing in has Level 1's construction outline.
- A full cell (two digits) moves on to the next empty one; so does ✓ (Enter). Once
  the step is full, ✓ checks it. Arrows move to the nearest cell in their direction.
  Backspace deletes, and from an empty cell steps back into the one before.
  Tapping a cell of the current step moves the cursor there.
- Checking is per step. Wrong: the step shakes, only its wrong cells clear, a heart
  is lost. Right: green, then the next step opens.
- Simplest form is required. If the sum is written unsimplified (3/6), it is right
  as a step, and one more "= □/□" appears for its simplest form (1/2).
- Layout, always aligned on "=", by screen shape: one line on wide screens; sideways
  phones break after the rewrite with the sum under the first "=" (paper's way);
  upright phones put each step on its own line, "=" signs in a column (a phone too
  short for that, and upright tablets, use the sideways layout). ?layout= forces one.
  Room for a simplest-form step is kept from the start, so nothing resizes mid-problem.
-->

<script type="module">
// ===== Shared mockup core (inlined by build.mjs into both complex mockups) =====
// Typesetting on measured ink, as the game does it (src/layout.js): every
// glyph is scanned at its real device size (src/scanner.js), placed so its
// ink lands where the layout wants it, and every line, box edge and baseline
// sits on whole device pixels. The level code supplies the layout of its
// problem; this part has the measuring, the drawing primitives, the keypad,
// the header, the keys and the feedback timing.
import { fontsReady } from '/src/fonts.js';
import { createScanner } from '/src/scanner.js';
import { snap, onLayoutGrid } from '/src/ink.js';
import { fitHeader } from '/src/header.js';

const INK = '#eef5ff', MUTED = '#b6cdee';
const SELECTOR = '2026-10-21-level2-selector-mockup.html?concept=a';
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const params = new URLSearchParams(location.search);
const scan = createScanner();
const R = () => devicePixelRatio;
const S = v => snap(v, R());                                        // nearest device pixel
const floorD = v => Math.floor(v * R() + 1e-3) / R() + 0;
const ceilD = v => Math.ceil(v * R() - 1e-3) / R() + 0;
const px = v => onLayoutGrid(v, R()) + 'px';                         // a length exactly on the layout grid
const kindOf = ch => (/\d/.test(ch) ? 'n' : ch === 'x' ? 'v' : 'op'); // digit, variable, operator

const dom = {
  top: $('.top'), stage: $('.stage'), work: $('#work'), qnum: $('#qnum'), pad: $('.pad'),
  sink: $('#sink'), status: $('#status'), lives: $('.lives'), hearts: [...document.querySelectorAll('.lives svg')],
};
const caret = document.createElement('div');
caret.className = 'caret';

// ---------- Fonts ----------
// The game's fonts (src/fonts.js), plus Plex Mono italic when a level sets
// a variable: "x" is italic, the maths convention.
async function loadFonts(italic) {
  const jobs = [fontsReady()];
  if (italic) {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@1,500&display=block';
    const sheet = new Promise(res => { link.onload = res; link.onerror = res; });
    document.head.appendChild(link);
    jobs.push(Promise.race([sheet.then(() => document.fonts.load('italic 500 64px "IBM Plex Mono"', 'x')), wait(3000)]).catch(() => {}));
  }
  await Promise.all(jobs);
}

// ---------- Measuring ----------
// The baseline's place in a 1em, line-height 1 box, read from layout.
function probeBase(fs) {
  const box = document.createElement('span');
  box.style.cssText = 'position:absolute;visibility:hidden;display:block;height:1em;line-height:1;white-space:pre';
  box.innerHTML = '0<span style="display:inline-block;width:0;height:0;vertical-align:baseline"></span>';
  dom.work.appendChild(box);
  const base = (box.lastChild.getBoundingClientRect().top - box.getBoundingClientRect().top) / fs;
  box.remove();
  return base;
}

// The geometry of the problem's type at font size fs: the digit ink band
// (all ten digits), the cell (widest digit advance), the box padding and
// line, the construction outline's offset, the caret and the even ink gap
// between neighbours (Level 1's: 0.3em plus the side bearings).
function measureGeo(fs) {
  const work = dom.work;
  work.style.fontSize = fs + 'px';
  const family = getComputedStyle(work).fontFamily;
  const size = fs * R();
  const styles = {
    n: { weight: '500', family, color: INK },
    v: { weight: 'italic 500', family, color: INK },
    op: { weight: '500', family, color: MUTED },
  };
  const M = (ch, phase = 0) => scan(ch, styles[kindOf(ch)], size, phase);
  const digits = [...'0123456789'].map(c => M(c));
  const asc = Math.max(...digits.map(m => m.asc)), desc = Math.max(...digits.map(m => m.desc));
  const wide = Math.max(...digits.map(m => m.adv));
  const plus = M('+');
  const bearing = digits.reduce((s, m) => s + (wide - m.abl - m.abr) / 2, 0) / digits.length;
  const opBearing = (-plus.abl + plus.adv - plus.abr) / 2;
  const g = {
    fs, M, asc, desc, inkH: asc + desc, wide, base: probeBase(fs),
    pad: S(0.17 * fs),                                          // box padding, as Level 1
    bw: Math.max(S(Math.max(0.025 * fs, 2)), 1 / R()),          // box line, as Level 1
    oo: floorD(Math.max(0.06 * fs, 5)),                         // construction outline offset, as Level 1
    cw: Math.max(S(Math.max(0.05 * fs, 2)), 1 / R()),           // caret width, as Level 1
    G: (0.3 + bearing + opBearing) * fs,                        // the even ink gap
  };
  g.inkW = ch => (M(ch).abl + M(ch).abr) * fs;
  // The baseline that puts ch's ink centre at y = mid, on a whole device pixel.
  g.opBy = (ch, mid) => S(mid + (M(ch).asc - M(ch).desc) / 2 * fs);
  // The digit ink centre for a baseline.
  g.mid = by => by - (asc - desc) / 2 * fs;
  return g;
}

// A box for `inkW` px of content: equal padding on all four sides. The inner
// height is a whole number of device pixels, picked so the digit band can be
// centred in it with the baseline on a whole device pixel too (off: the
// baseline's distance below the inner top).
function boxDims(g, inkW) {
  const inW = S(inkW + 2 * g.pad);
  const h0 = g.inkH * g.fs + 2 * g.pad, lift = (g.asc - g.desc) * g.fs;
  let best = null;
  for (const h of [floorD(h0), ceilD(h0)]) {
    const off = S((h + lift) / 2), err = Math.abs(2 * off - h - lift);
    if (!best || err < best.err - 1e-6) best = { h, off, err };
  }
  return { inW, inH: best.h, off: best.off, bxW: inW + 2 * g.bw, bxH: best.h + 2 * g.bw };
}

// ---------- Drawing ----------
// What is drawn, across: lines and boxes, and glyph ink as placed (not as
// modelled), so the problem is centred on what you see.
let drawnX = null;
const trackX = (l, r) => { drawnX = drawnX ? { l: Math.min(drawnX.l, l), r: Math.max(drawnX.r, r) } : { l, r }; };
const el = (tag, cls, parent) => { const e = document.createElement(tag); e.className = cls; parent?.appendChild(e); return e; };
function rect(cls, parent, x, y, w, h) {
  trackX(x, x + w);
  const e = el('div', cls, parent);
  Object.assign(e.style, { left: px(x), top: px(y), width: px(w), height: px(h) });
  return e;
}

// Where a run of characters puts its ink, from the first pen position, one
// cell per character (Plex Mono is monospaced): { l, r } in px.
function runInk(g, chars) {
  const first = g.M(chars[0]), last = g.M(chars[chars.length - 1]);
  return { l: -first.abl * g.fs, r: ((chars.length - 1) * g.wide + last.abr) * g.fs };
}

// One glyph whose ink should be centred where it would be with its pen at
// `origin` (as scanned at phase 0), on the baseline `by`. The page draws
// text at fractions of a device pixel, and the ink comes out a little
// differently at each (up to 0.3px at 1x), so the pen goes at whichever
// eighth of a device pixel, scanned there, puts the ink centre closest to
// where the layout wants it. (Measured: the page draws a glyph exactly as
// the scanner does at each eighth.) Returns the ink's ends as drawn.
function placeChar(g, e, ch, origin, by) {
  const d = R(), m0 = g.M(ch);
  const target = origin + (m0.abr - m0.abl) / 2 * g.fs;
  const base = Math.floor(origin * d) / d;
  let best = null;
  for (let k = -8; k <= 16; k++) {
    const x = base + k / 8 / d, m = g.M(ch, (((k % 8) + 8) % 8) / 8);
    const err = Math.abs(x + (m.abr - m.abl) / 2 * g.fs - target);
    if (!best || err < best.err - 1e-9) best = { x, m, err };
  }
  e.style.left = onLayoutGrid(best.x, d) + 'px';
  e.style.top = px(by - g.base * g.fs);
  const ink = { l: best.x - best.m.abl * g.fs, r: best.x + best.m.abr * g.fs };
  trackX(ink.l, ink.r);
  return ink;
}

// A run of characters with its ink centred on cx: digits and x on the
// baseline `by`, operators centred on the digit ink. Returns the ink's ends.
function setRun(g, parent, chars, cx, by, cls = '', align = 'centre') {
  const ink = runInk(g, chars);
  const x0 = align === 'right' ? cx - ink.r : align === 'left' ? cx - ink.l : cx - (ink.l + ink.r) / 2;
  let drawn = null;
  const els = chars.map((ch, i) => {
    const e = el('span', `t ${kindOf(ch)} ${cls}`, parent);
    e.textContent = ch;
    const at = placeChar(g, e, ch, x0 + i * g.wide * g.fs, kindOf(ch) === 'op' ? g.opBy(ch, g.mid(by)) : by);
    drawn = drawn ? { l: drawn.l, r: at.r } : at;
    return e;
  });
  return { els, l: drawn.l, r: drawn.r };
}

// The caret in a cell (Level 1 §4): as tall as the digit ink, snapped
// outward to whole device pixels; centred in an empty cell; a fixed gap after
// the ink otherwise; hidden in a full cell.
function placeCaret(g, cell, value, inkR, full) {
  caret.classList.toggle('off', full);
  if (full) return;
  const top = floorD(cell.by - g.asc * g.fs), bottom = ceilD(cell.by + g.desc * g.fs);
  // One device pixel wider when that lets it sit exactly in the middle of the box.
  const cw = Math.round((cell.w - g.cw) * R()) % 2 ? g.cw + 1 / R() : g.cw;
  const left = value ? S(inkR + Math.max(0.08 * g.fs, 4))
    : cell.emptyX !== undefined ? S(cell.emptyX) : S(cell.x + cell.w / 2 - cw / 2);
  Object.assign(caret.style, { left: px(left), top: px(top), width: px(cw), height: px(bottom - top) });
  caret.style.animation = 'none';           // solid right after a key, then blink
  void caret.offsetWidth;
  caret.style.animation = '';
}

// "Question N" over the middle of what you see, centred on its own ink
// (Level 1 placeLabel), its box `gap` above the top of the problem.
function placeLabel(g, cx, top, nudge = 0) {
  const q = dom.qnum;
  const lfs = Math.max(15, 0.16 * g.fs);
  q.style.fontSize = lfs + 'px';
  const cs = getComputedStyle(q);
  const st = { weight: cs.fontWeight, family: cs.fontFamily, color: cs.color, spacing: (parseFloat(cs.letterSpacing) || 0) / lfs };
  const m = scan(q.textContent, st, lfs * R());
  q.style.left = px(cx - (m.abr - m.abl) / 2 * lfs);
  q.style.top = px(top - labelReach(g));
  // Its baseline on a whole device pixel (text is drawn there), moved up by
  // `nudge`; returns its ink top from the work's origin.
  const probe = document.createElement('span');
  probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
  q.appendChild(probe);
  const base = probe.getBoundingClientRect().top - q.getBoundingClientRect().top;
  probe.remove();
  const baseline = S(top - labelReach(g) + base) + nudge;
  q.style.top = px(baseline - base);
  return baseline - m.asc * lfs;
}

// Centre "Question N" (from its ink top) and the board together. The origin
// goes on a whole device pixel, which can leave the pair up to half a device
// pixel off; moving the label up one device pixel moves their middle by half
// of one, so whichever of the two is closer is used.
function centreGroup(g, seen) {
  const cx = (seen.l + seen.r) / 2, s = dom.stage.getBoundingClientRect();
  const miss = t => { const want = s.top + s.height / 2 - (t + seen.b) / 2; return Math.abs(S(want) - want); };
  let best = null;
  for (const nudge of [0, -1 / R()]) {
    const e = miss(placeLabel(g, cx, seen.t, nudge));
    if (!best || e < best.e - 1e-6) best = { nudge, e };
  }
  centreWork({ ...seen, t: placeLabel(g, cx, seen.t, best.nudge) });
}
const labelGap = g => Math.max(0.2 * g.fs, 18);
const labelReach = g => labelGap(g) + 1.25 * Math.max(15, 0.16 * g.fs);
// The board and "Question N" are centred together, with at least the
// label's gap to the board (plus the area's 8px) above the label and below
// the board, so the label reads as the board's, not the header's.
// `extra`: more room either side (the equations keep the outline's reach clear of the keypad).
const boardHeight = (g, box, extra = 0) => box.b - box.t + labelReach(g) + 2 * (labelGap(g) + extra);

// The problem's start size: Level 1's equation size, clamp(40px, min(17vw, 15dvh), 128px).
const maxFs = () => Math.min(128, Math.max(40, Math.min(0.17 * innerWidth, 0.15 * innerHeight)));

// Room in the problem area: between the side gutters, and 8px clear above
// "Question N" and below the problem's outline (Level 1 §3.2).
function room() {
  const gutter = parseFloat(getComputedStyle(dom.stage).getPropertyValue('--gutter')) || 16;
  return { w: dom.stage.clientWidth - 2 * gutter - 1, h: dom.stage.clientHeight - 16 - 1 };
}

// Put the layout origin on a whole device pixel, with what you see (box:
// the board with "Question N" above it) centred in the problem area.
function centreWork(box) {
  const s = dom.stage.getBoundingClientRect();
  dom.work.style.left = px(S(s.left + s.width / 2 - (box.l + box.r) / 2) - s.left);
  dom.work.style.top = px(S(s.top + s.height / 2 - (box.t + box.b) / 2) - s.top);
}

// Slide the work from where it was drawn last into its new place (0.25s).
function glide(before) {
  const now = dom.work.getBoundingClientRect();
  const dx = before.left - now.left, dy = before.top - now.top;
  if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) return;
  dom.work.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 250, easing: 'ease-out' });
}

// ---------- Header ----------
// The "Levels" link's underline, from its first ink to its last (Level 2 play mockup).
function underline() {
  const link = $('.crumbs .back');
  const cs = getComputedStyle(link);
  const fs = parseFloat(cs.fontSize);
  const m = scan(link.textContent, { weight: cs.fontWeight, family: cs.fontFamily, color: cs.color, spacing: (parseFloat(cs.letterSpacing) || 0) / fs }, fs * R());
  const box = link.getBoundingClientRect();
  link.style.setProperty('--ul-left', (snap(box.left - m.abl * fs, R()) - box.left) + 'px');
  link.style.setProperty('--ul-right', (box.right - snap(box.left + m.abr * fs, R())) + 'px');
}

function renderLives(lives) {

      key: kl.parentElement.getBoundingClientRect(), label: kl.getBoundingClientRect(),
      baseY: S(probes[i].getBoundingClientRect().top), kfs: parseFloat(cs.fontSize),

// ===== Fraction addition with unlike denominators =====
const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a; };

  for (;;) {
    const d1 = 2 + Math.floor(rng() * 8), d2 = 2 + Math.floor(rng() * 8);
    if (d1 === d2) continue;
    const n1 = 1 + Math.floor(rng() * (d1 - 1)), n2 = 1 + Math.floor(rng() * (d2 - 1));
    if (gcd(n1, d1) !== 1 || gcd(n2, d2) !== 1) continue;

const FIRST = parseProblem(params.get('p')) ?? (params.get('random') === '1' ? makeProblem() : { n1: 1, d1: 3, n2: 1, d2: 4 });

// ---------- State ----------

// sum was written unsimplified) its simplest form. Each step's cells are

// ---------- Checking (per step) ----------

    const common = d => d % p.d1 === 0 && d % p.d2 === 0;

// ---------- Layout ----------
// Three ways to set it, all aligned on "=", chosen by the screen's shape
// (not by size, so neighbouring phones agree):

//  classic (phones sideways), the next step under the first "=", as on paper:
//                           1/3 + 1/4 = □/□ + □/□

//  steps (phones upright), a step per line, the "=" signs in a column:

const op = ch => ({ type: 'op', ch });

  state.steps.forEach((s, i) => list.push({
    key: i, status: s.status,
    items: s.kind === 'rewrite' ? [op('='), boxed(i, 'n1', 'd1'), op('+'), boxed(i, 'n2', 'd2')] : [op('='), boxed(i, 'n', 'd')],

// The fraction's measures at this size. A cell holds up to two digits (the

  const b = boxDims(g, two);

// ---------- Feedback ----------
// Per step. Wrong: the step shakes, its wrong cells clear (right ones stay),
// the cursor goes to the first cleared one, a heart is lost. Right: the step

    state.act = step.cells.findIndex(c => res.wrong.has(c.id));
    renderCells();
    renderLives(state.lives);
    play(partOf(si).el, 'shake');
    if (state.lives === 0) {
      state.phase = 'out';
      renderFocus();
      say('Out of lives');
      setTimeout(() => { if (state.phase === 'out') location.href = SELECTOR; }, 450);

  return 'step';
}

async function advance(si) {
  state.phase = 'step';
  const grp = partOf(si).el;
  grp.classList.add('good');
  renderFocus();
  say('Right');
  await wait(350);
  state.steps[si].status = 'done';
  grp.classList.remove('good');
  grp.classList.replace('current', 'done');
  if (si + 1 === state.steps.length) {
    // The sum was right but not in simplest form: one more step, on the same
    // line (or the sum's line, wrapped). The size was kept for it.
    state.steps.push({ kind: 'simplify', status: 'current', cells: cells(['d', 'n']) });
    const before = dom.work.getBoundingClientRect();
    draw();
    partOf(si + 1).el.classList.add('appear');
    glide(before);
  } else {
    state.steps[si + 1].status = 'current';
    partOf(si + 1).el.classList.replace('future', 'current');
  }
  Object.assign(state, { cur: si + 1, act: 0, phase: 'playing' });
  renderFocus();
}

async function finish() {
  state.phase = 'correct';
  state.steps[state.cur].status = 'done';
  partOf(state.cur).el.classList.replace('current', 'done');
  dom.work.classList.add('good');
  renderFocus();
  say('Correct');
  await wait(350);
  await slideOut();
  state.q += 1;
  fresh(makeProblem());
  dom.work.classList.remove('good');
  renderLives(state.lives);
  draw();
  announce();
  play(dom.work, 'in');
}

// ---------- Review states ----------
// ?state=empty | partial | done | wrong, on the problem shown.
function applyState(name) {
  const p = state.p, L = lcm(p.d1, p.d2), a = p.n1 * L / p.d1, b = p.n2 * L / p.d2, N = a + b, k = gcd(N, L);
  const [s0, s1] = state.steps;
  const fill = (step, o) => step.cells.forEach(c => { c.v = o[c.id] === undefined ? '' : String(o[c.id]); });
  if (name === 'partial') {
    fill(s0, { d1: L, d2: L, n1: a, n2: b });
    fill(s1, { d: L });
    s0.status = 'done';
    s1.status = 'current';
    Object.assign(state, { cur: 1, act: 1 });
  } else if (name === 'wrong') {
    fill(s0, { d1: L, d2: L, n1: a });          // the second numerator was wrong and cleared
    Object.assign(state, { act: 3, lives: 2 });
  } else if (name === 'done') {
    fill(s0, { d1: L, d2: L, n1: a, n2: b });
    fill(s1, { d: L, n: N });
    s0.status = s1.status = 'done';
    if (k > 1) state.steps.push({ kind: 'simplify', status: 'done', cells: [{ id: 'd', v: String(L / k) }, { id: 'n', v: String(N / k) }] });
    Object.assign(state, { cur: state.steps.length - 1, phase: 'correct' });
  }
}

// ---------- Start ----------
fresh(FIRST);
const named = params.get('state');
applyState(named);
await loadFonts(false);
renderLives(state.lives);
try { relayout(); } catch (err) { console.error(err); }
if (named === 'done') dom.work.classList.add('good');
document.documentElement.classList.remove('loading');
if (named === 'wrong') play(partOf(0).el, 'shake');
announce();
bindKeys(mapKey, onKey, onTap);
let queued = false;
const resized = new ResizeObserver(() => {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; try { relayout(); } catch (err) { console.error(err); } });
});
resized.observe(dom.stage);
resized.observe(dom.top);
// A font that loads late (after the 3s wait) changes every measurement: start again.
document.fonts.addEventListener('loadingdone', () => { scan.reset(); try { relayout(); } catch (err) { console.error(err); } });
dom.sink.focus({ preventScroll: true });
const rows = () => {
  const top = dom.work.getBoundingClientRect().top, ys = new Set();
  for (const part of LAY.list) if (!part.phantom) for (const it of part.items) if (it.type !== 'op') { ys.add(top + it.Y + LAY.f.bn); ys.add(top + it.Y + LAY.f.bd); }
  return [...ys];
};
window.mathtime = { state, relayout, onKey, geo: () => G, lay: () => LAY, mode: () => MODE, rows };

</script>
