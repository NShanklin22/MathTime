<!doctype html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MathTime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The Google Fonts stylesheet (IBM Plex Mono and Sans) is added by src/fonts.js so it can be timed out. -->
<link rel="stylesheet" href="src/styles.css">
<script type="module" src="src/main.js"></script>
</head>
<!-- data-kind: the kind of level being played, which shows its play screen
     (main.js): "fact", the equation; "column", the column board. -->
<body class="at-select" data-kind="fact">
  <header class="top">
    <div class="where">
      <!-- "Levels › Addition 1": the way back, and the level by its topic and
           its number within it (view.js, board.js). Where the whole of it,
           with the widest level name, doesn't fit beside the hearts, every
           level's way back is its chevron alone, the separator pointing
           left, "‹ Addition 1" (header.js); it is still the link "Levels".
           The chevron is the separator mirrored and moved 0.25px left, so
           its ink (the stroke, with its round caps and join) runs from 3px
           to 8px of its box: header.js puts the box on a whole device pixel
           at the header's edge, and so the ink starts on one too. -->
      <nav class="crumbs" aria-label="Breadcrumb">
        <a class="back" href="#" aria-label="Levels" aria-keyshortcuts="Escape" tabindex="-1"><span class="word">Levels</span><svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.25 2.5L3.75 6l3.5 3.5"/></svg></a>
        <svg class="sep" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>
        <span class="here" aria-current="step">Addition 1</span>
        <span class="home" aria-current="page">Levels</span>
      </nav>
    </div>
    <div class="lives" role="img" aria-label="3 lives left">
      <svg viewBox="2 3 20 18" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>
      <svg viewBox="2 3 20 18" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>
      <svg viewBox="2 3 20 18" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>
    </div>
    <!-- The account link (accounts spec §4), on the level selector only:
         "Log in", or your name, which a tap turns to "Log out" (login.js). -->
    <button class="acct" type="button">Log in</button>
  </header>

  <main class="stage">
    <div class="eq" id="eq">
      <span class="qnum" id="qnum">Question 1 of 20</span>
      <span id="a">7</span>
      <span class="op">+</span>
      <span id="b">5</span>
      <span class="op">=</span>
      <span class="slot empty" id="slot">
        <span class="shown" aria-hidden="true"><span id="shown"></span><span class="caret"></span></span>
        <input id="ans" inputmode="none" maxlength="2" autocomplete="off" aria-label="Answer">
      </span>
    </div>
    <!-- A column level's play screen (Levels 6–7), drawn by board.js. On a
         column level the answer field above is moved in after it (main.js). -->
    <div class="board" id="board" aria-hidden="true"></div>
  </main>

  <!-- How far through the run you are (runs spec §2): a segment per
       problem, built by view.js. Screen readers hear "Question N of 20"
       instead. -->
  <div class="run" aria-hidden="true"></div>

  <!-- Outside .stage so announcements survive the switch to the level selector. -->
  <p class="sr-only" role="status" id="status"></p>

  <!-- The level selector: a row per level, built by selector.js. A landmark
       of its own, as the only <main> is the problem area, hidden here. -->
  <div class="select" role="region" aria-label="Levels"></div>

  <!-- The finish screen (runs spec §3), filled in by finish.js, which
       centres each line on its ink. -->
  <div class="finish" role="region" aria-labelledby="done-title">
    <h1 class="line done-title" id="done-title"></h1>
    <p class="line done-time"></p>
    <p class="line done-best"></p>
    <p class="line done-misses"></p>
    <!-- Part 2 puts the key field here (runs spec §6). -->
    <div class="done-buttons">
      <button class="again"><span class="line">Again</span></button>
      <button class="levels"><span class="line">Levels</span></button>
    </div>
  </div>

  <!-- The log-in screen (accounts spec §3), run by login.js: Log in, or
       Sign up with the invite code shown too. No keypad: the system's own
       keyboard types here. -->
  <div class="login" role="region" aria-labelledby="login-title">
    <h1 class="sr-only" id="login-title">Log in</h1>
    <form novalidate>
      <div class="fields">
        <div class="field" data-for="signup" hidden>
          <div class="labels"><label for="f-invite">Invite code</label></div>
          <input id="f-invite" name="invite" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-describedby="f-error">
        </div>
        <div class="field">
          <div class="labels"><label for="f-name">Name</label><span class="hint" id="h-name" data-for="signup" hidden>3–20 letters, digits, _&nbsp;-</span></div>
          <input id="f-name" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" enterkeyhint="next" aria-describedby="f-error">
        </div>
        <div class="field">
          <div class="labels"><label for="f-pass">Password</label><span class="hint" id="h-pass" data-for="signup" hidden>8 or more characters</span></div>
          <input id="f-pass" name="password" type="password" autocomplete="current-password" enterkeyhint="go" aria-describedby="f-error">
        </div>
      </div>
      <div class="actions">
        <button class="submit" type="submit"><span class="line">Log in</span></button>
        <p class="error" id="f-error" role="alert"></p>
        <p class="switch"><span class="ask">Have an invite?</span> <button class="swap" type="button">Sign up</button></p>
      </div>
    </form>
  </div>

  <div class="pad" role="group" aria-label="Keypad">
    <button tabindex="-1" data-k="1"><span class="kl">1</span></button>
    <button tabindex="-1" data-k="2"><span class="kl">2</span></button>
    <button tabindex="-1" data-k="3"><span class="kl">3</span></button>
    <button tabindex="-1" data-k="4"><span class="kl">4</span></button>
    <button tabindex="-1" data-k="5"><span class="kl">5</span></button>
    <button tabindex="-1" data-k="6"><span class="kl">6</span></button>
    <button tabindex="-1" data-k="7"><span class="kl">7</span></button>
    <button tabindex="-1" data-k="8"><span class="kl">8</span></button>
    <button tabindex="-1" data-k="9"><span class="kl">9</span></button>
    <button tabindex="-1" data-k="Backspace" aria-label="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(-0.5 0)"><path d="M20 6H9l-5 6l5 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M12.25 10.25l3.5 3.5m0-3.5l-3.5 3.5"/></g></svg></button>
    <button tabindex="-1" data-k="0"><span class="kl">0</span></button>
    <button tabindex="-1" data-k="Enter" class="go" aria-label="Check answer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5l5.5 5.5l11.5-11.5"/></svg></button>
  </div>
</body>
</html>
