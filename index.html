<!doctype html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MathTime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- IBM Plex Mono for everything; IBM Plex Sans supplies Greek (spec §5.2). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=block">
<link rel="stylesheet" href="src/styles.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="top">
    <div class="where">
      <div class="crumbs">
        <span class="stage-name">Arithmetic</span>
        <svg class="sep stage-sep" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>
        <span class="sub-name">Addition</span>
        <svg class="sep sub-sep" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg>
        <span class="here">Level 1</span>
      </div>
      <div class="road" role="img" aria-label="Roadmap stage 1 of 7: Arithmetic. Then fractions, algebra, geometry, trigonometry, calculus, physics.">
        <span class="now" title="Arithmetic"></span>
        <span title="Fractions"></span>
        <span title="Algebra"></span>
        <span title="Geometry"></span>
        <span title="Trigonometry"></span>
        <span title="Calculus"></span>
        <span title="Physics"></span>
      </div>
    </div>
    <div class="lives" role="img" aria-label="3 lives left">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572"/></svg>
    </div>
  </header>

  <main class="stage">
    <div class="eq" id="eq">
      <span class="qnum" id="qnum">Question 1</span>
      <span id="a">7</span>
      <span class="op">+</span>
      <span id="b">5</span>
      <span class="op">=</span>
      <span class="slot empty" id="slot">
        <span class="shown"><span id="shown"></span><span class="caret"></span></span>
        <input id="ans" inputmode="none" maxlength="2" autocomplete="off" aria-label="Answer">
      </span>
    </div>
  </main>

  <div class="select">
    <button id="level1">Level 1</button>
  </div>

  <nav class="pad" aria-label="Keypad">
    <button data-k="1"><span class="kl">1</span></button>
    <button data-k="2"><span class="kl">2</span></button>
    <button data-k="3"><span class="kl">3</span></button>
    <button data-k="4"><span class="kl">4</span></button>
    <button data-k="5"><span class="kl">5</span></button>
    <button data-k="6"><span class="kl">6</span></button>
    <button data-k="7"><span class="kl">7</span></button>
    <button data-k="8"><span class="kl">8</span></button>
    <button data-k="9"><span class="kl">9</span></button>
    <button data-k="Backspace" aria-label="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="translate(-0.5 0)"><path d="M20 6H9l-5 6l5 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1z"/><path d="M12.25 10.25l3.5 3.5m0-3.5l-3.5 3.5"/></g></svg></button>
    <button data-k="0"><span class="kl">0</span></button>
    <button data-k="Enter" class="go" aria-label="Check answer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5l5.5 5.5l11.5-11.5"/></svg></button>
  </nav>
</body>
</html>
