# MathTime on mainframe. The game is static files (index.html and src/), which deploy/deploy.sh copies to
# /var/www/mathtime, so nginx serves them itself. Only /api/ goes on, to the API container that
# deploy/compose.yaml binds to 127.0.0.1:3006 (accounts, runs and best times).
#
# Install as /etc/nginx/sites-available/mathtime, symlink into sites-enabled, `sudo nginx -t`, reload.
# Then `sudo certbot --nginx -d math.nshanklin.com`, which rewrites this block for TLS.

server {
    listen 80;
    server_name math.nshanklin.com;   # also SITE_HOST in deploy/deploy.sh

    root /var/www/mathtime;
    index index.html;

    # The modules have no version in their names, so browsers must ask on every load (a cheap 304 when
    # nothing changed). Otherwise, after a deploy, a browser could run a new main.js with an old layout.js.
    add_header Cache-Control "no-cache";

    gzip on;
    gzip_types text/css application/javascript text/javascript;

    location / {
        try_files $uri $uri/ =404;
    }

    # The API. X-Real-IP is the caller's address, for its log-in rate limit; without it every caller would
    # look like 127.0.0.1 and share one limit. Its answers are never cached: the API says no-store, and
    # this block's own add_header keeps the "no-cache" above from being added as a second, clashing one.
    # 64k is the API's own body limit, so a bigger body gets nginx's 413 before reaching it.
    location /api/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        client_max_body_size 64k;
    }
}
